<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>勇者の冒険 REAL v24 2D HD LIVING WORLD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0c1c25;image-rendering:pixelated}
.panel{background:rgba(7,12,18,.76);border:1px solid rgba(255,255,255,.14);border-radius:13px;backdrop-filter:blur(8px)}
#hud{position:fixed;left:10px;top:max(10px,env(safe-area-inset-top));z-index:20;padding:8px 10px;min-width:190px;font-size:10px;line-height:1.4}
.bar{display:inline-block;width:80px;height:7px;background:#ffffff18;border-radius:10px;overflow:hidden;vertical-align:middle}
.fill{display:block;height:100%}.hp{background:#ff675f}.mp{background:#59b9ff}.st{background:#7ada76}.xp{background:#efc75b}
#objective{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:20;padding:6px 9px;font-size:10px;max-width:58vw;text-align:center}
#aiChip{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:20;padding:5px 8px;font-size:9px;max-width:62vw;text-align:center}
#eventChip{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:20;padding:5px 8px;font-size:9px;max-width:64vw;text-align:center}
#message{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:30;padding:7px 10px;font-size:11px;opacity:0;transition:opacity .2s;min-width:170px;text-align:center}
#message.show{opacity:1}
#stick{position:fixed;left:18px;bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));z-index:26;width:108px;height:108px;border-radius:50%;border:1px solid #ffffff35;background:#ffffff10}
#knob{position:absolute;left:30px;top:30px;width:48px;height:48px;border-radius:50%;background:#ffffff35;border:1px solid #ffffff4c}
#actions{position:fixed;right:12px;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));z-index:26;display:grid;grid-template-columns:repeat(3,45px);gap:6px}
.action{width:45px;height:45px;border-radius:50%;border:1px solid #ffffff30;background:#132130;color:#fff;font-size:8px;font-weight:700}
.action b{display:block;font-size:16px}
#menuBtn,#diagBtn,#aiBtn{position:fixed;right:10px;z-index:28;width:42px;height:42px;border:0;border-radius:11px;background:#101923;color:#fff;font-size:19px}
#menuBtn{top:92px}#diagBtn{top:140px}#aiBtn{top:188px}
#gameMenu,#diag,#aiPanel{display:none;position:fixed;left:50%;top:10%;transform:translateX(-50%);z-index:60;width:min(92vw,560px);max-height:76vh;overflow:auto;padding:14px}
#gameMenu.open,#diag.open,#aiPanel.open{display:block}
#menuTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.menuTab,.menuBtn2{padding:8px 7px;border:1px solid #ffffff20;border-radius:9px;background:#14202d;color:#fff;font-size:10px}
.row{padding:8px 0;border-bottom:1px solid #ffffff12;font-size:11px}
.skill{color:#8fffd4;font-weight:800}.quest{color:#ffd97a}
#titleScreen{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#17334c,#071019 68%)}
#titleCard{width:min(88vw,430px);padding:22px;text-align:center}
#titleCard h1{font-size:30px;margin:0 0 8px}
#titleCard p{font-size:11px;opacity:.85;line-height:1.6}
#startBtn{padding:12px 18px;border:0;border-radius:12px;background:#2f80ed;color:#fff;font-weight:800;font-size:15px}
#bossHUD{display:none;position:fixed;left:50%;top:104px;transform:translateX(-50%);z-index:25;width:min(74vw,540px);padding:8px 10px;text-align:center;font-size:10px}
#bossBar{height:8px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-top:5px}#bossFill{height:100%;background:#ff5c62;width:100%}
#zone{display:none;position:fixed;left:50%;top:23%;transform:translateX(-50%);z-index:35;padding:10px 16px;font-size:19px;font-weight:900}
#mythicToast{display:none;position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:75;width:min(88vw,500px);padding:15px;text-align:center;background:linear-gradient(135deg,rgba(29,12,42,.96),rgba(7,24,28,.96));border:1px solid #d59cff88;border-radius:16px;box-shadow:0 14px 40px #000b}
#mythicToast.show{display:block}.tier{font-size:10px;opacity:.75;letter-spacing:.12em}.mythicName{font-size:22px;font-weight:900;margin:5px 0}.mythicDesc{font-size:11px}
#perf{position:fixed;left:8px;bottom:8px;z-index:18;padding:4px 6px;font-size:8px;opacity:.65}
</style>
</head>
<body>
<div id="titleScreen"><div id="titleCard" class="panel"><h1>勇者の冒険</h1><p>REAL v24 2D HD LIVING WORLD<br>高精細ピクセルアート風・巨大ワールド・AI職業・神話級ボス</p><button id="startBtn">冒険を始める</button></div></div>

<canvas id="game"></canvas>
<div id="hud" class="panel"></div>
<div id="objective" class="panel">目的：世界を探索する</div>
<div id="aiChip" class="panel">🤖 AI WORLD MASTER</div>
<div id="eventChip" class="panel">🌤️ 晴れ / 昼</div>
<div id="message" class="panel"></div>
<div id="bossHUD" class="panel"><div id="bossName"></div><div id="bossBar"><div id="bossFill"></div></div></div>
<div id="zone" class="panel"></div>
<div id="mythicToast"><div class="tier"></div><div class="mythicName"></div><div class="mythicDesc"></div></div>
<div id="perf" class="panel">FPS --</div>

<button id="menuBtn">☰</button>
<button id="diagBtn">🛠️</button>
<button id="aiBtn">🤖</button>
<div id="gameMenu" class="panel"></div>
<div id="diag" class="panel"></div>
<div id="aiPanel" class="panel"></div>

<div id="stick"><div id="knob"></div></div>
<div id="actions">
 <button class="action" id="attackBtn"><b>⚔️</b>攻撃</button>
 <button class="action" id="skillBtn"><b>🔥</b>技</button>
 <button class="action" id="dodgeBtn"><b>💨</b>回避</button>
 <button class="action" id="guardBtn"><b>🛡️</b>防御</button>
 <button class="action" id="interactBtn"><b>💬</b>調べる</button>
 <button class="action" id="specialBtn"><b>⚡</b>必殺</button>
</div>

<script>
(()=>{'use strict';

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const hud=document.getElementById('hud'),objective=document.getElementById('objective'),aiChip=document.getElementById('aiChip'),eventChip=document.getElementById('eventChip'),messageEl=document.getElementById('message');
const menu=document.getElementById('gameMenu'),diag=document.getElementById('diag'),aiPanel=document.getElementById('aiPanel'),bossHUD=document.getElementById('bossHUD'),bossName=document.getElementById('bossName'),bossFill=document.getElementById('bossFill');
const zoneEl=document.getElementById('zone'),perf=document.getElementById('perf');

const SYS={engine:true,world:true,player:true,controls:true,enemies:true,combat:true,ai:true,save:true,respawn:true,mythic:true};
function renderDiag(){diag.innerHTML='<h3>🛠️ SYSTEM DIAGNOSTIC</h3>'+Object.entries(SYS).map(([k,v])=>`<div class="row">${v?'✅':'❌'} ${k}</div>`).join('')}
function msg(t){messageEl.textContent=t;messageEl.classList.add('show');clearTimeout(msg._t);msg._t=setTimeout(()=>messageEl.classList.remove('show'),1800)}
function mythicToast(tier,name,desc){const b=document.getElementById('mythicToast');b.querySelector('.tier').textContent=tier;b.querySelector('.mythicName').textContent=name;b.querySelector('.mythicDesc').textContent=desc;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),2400)}

let dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}
resize();addEventListener('resize',resize);

const TILE=32,CHUNK=20;
const state={lv:1,xp:0,hp:240,maxHp:240,mp:120,maxMp:120,st:120,maxSt:120,gold:300,atk:30,burst:0,guard:false,dodge:0,kills:0,bossKills:0};
const player={x:0,y:0,dir:2,anim:0,attackAnim:0,dodgeAnim:0};
const profile={attacks:0,skills:0,dodges:0,guards:0,damageTaken:0};
const inventory=[{id:'potion',name:'回復薬',count:5},{id:'ore',name:'鉄鉱石',count:0},{id:'crystal',name:'星晶石',count:0},{id:'dragon',name:'竜鱗',count:0}];
const weapons=[{id:'sword',name:'片手剣',atk:30},{id:'greatsword',name:'大剣',atk:42},{id:'spear',name:'槍',atk:35},{id:'staff',name:'魔杖',atk:26}];
let weapon='sword';

const BIOMES=[
 {id:'plains',name:'緑風平原',ground:'#4f8c4a',path:'#8f7d56',tree:'#2b6934'},
 {id:'forest',name:'古代森林',ground:'#315f36',path:'#6e6642',tree:'#174b27'},
 {id:'snow',name:'白銀雪原',ground:'#c6dce0',path:'#aeb9bd',tree:'#6b8d86'},
 {id:'desert',name:'黄砂砂漠',ground:'#c6a85d',path:'#9d7c46',tree:'#9f7f3f'},
 {id:'volcano',name:'火山荒野',ground:'#6d473c',path:'#49302d',tree:'#3a322f'},
 {id:'swamp',name:'毒霧湿地',ground:'#486144',path:'#3a4a36',tree:'#263d2d'}
];
function hash(x,y){let n=(x*374761393+y*668265263)>>>0;n=(n^(n>>13))*1274126177>>>0;return ((n^(n>>16))>>>0)/4294967295}
function biomeAt(x,y){const cx=Math.floor(x/900),cy=Math.floor(y/900),v=Math.abs((cx*17+cy*31)%BIOMES.length);return BIOMES[v]}
function heightNoise(x,y){return hash(Math.floor(x/160),Math.floor(y/160))}
const chunks=new Map();
function key(cx,cy){return cx+','+cy}
function ensureChunk(cx,cy){
 const k=key(cx,cy);if(chunks.has(k))return chunks.get(k);
 const items=[],npcs=[],chests=[];
 for(let i=0;i<28;i++){
  const x=(cx*CHUNK+hash(cx*99+i,cy*31+i)*CHUNK)*TILE;
  const y=(cy*CHUNK+hash(cy*71+i,cx*17+i)*CHUNK)*TILE;
  const r=hash(cx*11+i,cy*13-i);
  items.push({x,y,type:r<.55?'tree':r<.82?'rock':'flower'});
 }
 if(hash(cx,cy)>.76)chests.push({x:(cx*CHUNK+10)*TILE,y:(cy*CHUNK+10)*TILE,opened:false});
 if(hash(cx+7,cy-5)>.83)npcs.push({name:'旅人',x:(cx*CHUNK+8)*TILE,y:(cy*CHUNK+7)*TILE});
 const c={cx,cy,items,npcs,chests};chunks.set(k,c);return c;
}
function activeChunks(){const cx=Math.floor(player.x/(CHUNK*TILE)),cy=Math.floor(player.y/(CHUNK*TILE)),arr=[];for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)arr.push(ensureChunk(cx+dx,cy+dy));return arr}

const enemies=[];
const RESPAWN_TARGET=28;
function spawnEnemy(type='wolf',around=true){
 const defs={
  wolf:{name:'影狼',hp:110,atk:13,speed:58,color:'#58616b',size:18},
  orc:{name:'岩肌オーク',hp:190,atk:20,speed:44,color:'#8b4d35',size:22},
  mage:{name:'深森の魔術師',hp:140,atk:18,speed:48,color:'#6b3b8c',size:20},
  demon:{name:'下級悪魔',hp:230,atk:24,speed:52,color:'#7b2437',size:22}
 };
 const d=defs[type]||defs.wolf,ang=Math.random()*Math.PI*2,r=around?420+Math.random()*500:700;
 enemies.push({type,name:d.name,x:player.x+Math.cos(ang)*r,y:player.y+Math.sin(ang)*r,hp:d.hp,maxHp:d.hp,atk:d.atk,speed:d.speed,color:d.color,size:d.size,alive:true,cd:0,boss:false,mythic:false,respawnAt:0});
}
function maintainEnemies(){
 const alive=enemies.filter(e=>e.alive&&!e.mythic).length;
 for(let i=alive;i<RESPAWN_TARGET;i++){const r=Math.random();spawnEnemy(r<.55?'wolf':r<.78?'orc':r<.93?'mage':'demon')}
}
for(let i=0;i<RESPAWN_TARGET;i++)spawnEnemy(i%5===0?'orc':i%7===0?'mage':'wolf');

const PANTHEON=[
 {id:'zeus',name:'雷霆王ゼウス',tradition:'ギリシャ神話',hp:1700,atk:40,speed:50,color:'#d5d5ff',skill:{id:'thunder_king',name:'雷霆の王権',desc:'必殺時に追加雷撃'}},
 {id:'odin',name:'隻眼王オーディン',tradition:'北欧神話',hp:1850,atk:43,speed:48,color:'#727789',skill:{id:'rune_eye',name:'叡智の魔眼',desc:'クリティカル率上昇'}},
 {id:'susanoo',name:'嵐神スサノオ',tradition:'日本神話',hp:1900,atk:44,speed:54,color:'#4f85ad',skill:{id:'storm_blade',name:'八荒嵐刃',desc:'剣攻撃に風追撃'}},
 {id:'ra',name:'太陽神ラー',tradition:'エジプト神話',hp:1750,atk:42,speed:49,color:'#f0b93a',skill:{id:'sun_core',name:'太陽核',desc:'昼間HP自然回復'}},
 {id:'tiamat',name:'原初竜ティアマト',tradition:'メソポタミア神話',hp:2700,atk:54,speed:42,color:'#743f8f',skill:{id:'dragon_origin',name:'原初竜権',desc:'最大HPと対ボス火力上昇'}},
 {id:'beelzebub',name:'蝿王ベルゼブブ',tradition:'悪魔伝承',hp:2150,atk:50,speed:52,color:'#536b2b',skill:{id:'devour',name:'貪喰王',desc:'敵撃破時HP/MP回復'}},
 {id:'belial',name:'無法王ベリアル',tradition:'悪魔伝承',hp:2250,atk:52,speed:50,color:'#9a3121',skill:{id:'lawless_flame',name:'無法炎界',desc:'瀕死時攻撃力上昇'}}
];
const MYTHIC={defeated:[],skills:[],active:null,lastSpawn:0};
function hasSkill(id){return MYTHIC.skills.some(s=>s.id===id)}
function grantSkill(s,src){if(hasSkill(s.id))return;MYTHIC.skills.push({...s,source:src});mythicToast('MYTHIC SKILL',s.name,s.desc)}
function spawnMythic(){
 if(MYTHIC.active?.alive)return;
 const pool=PANTHEON.filter(p=>!MYTHIC.defeated.includes(p.id));if(!pool.length)return;
 const d=pool[Math.floor(Math.random()*pool.length)],a=Math.random()*Math.PI*2,r=650;
 const e={...d,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,maxHp:d.hp,alive:true,cd:0,boss:true,mythic:true,size:38,phase:1};
 enemies.push(e);MYTHIC.active=e;MYTHIC.lastSpawn=performance.now();mythicToast(d.tradition,d.name,'神話級存在が顕現した');
}

const AI={job:'冒険者',mood:'balanced',difficulty:1,event:'平穏',skills:[],quests:[],last:0};
AI.has=id=>AI.skills.some(s=>s.id===id);
AI.analyze=()=>{
 if(profile.dodges>profile.guards+4)AI.job='影走士';else if(profile.guards>=10)AI.job='境界守護者';else if(profile.skills>=12)AI.job='魔剣士';else if(state.bossKills>=1)AI.job='討滅士';else AI.job='冒険者';
 AI.mood=state.hp/state.maxHp<.35?'support':state.kills>15?'challenge':'balanced';AI.difficulty=AI.mood==='challenge'?1.12:AI.mood==='support'?.9:1;
 const defs=[{id:'afterimage',name:'残影の境地',desc:'回避移動が高速化',ok:profile.dodges>=10},{id:'ironwall',name:'鉄壁反射',desc:'防御軽減率上昇',ok:profile.guards>=10},{id:'arcane',name:'魔力循環',desc:'スキル消費MP低下',ok:profile.skills>=15}];
 for(const s of defs)if(s.ok&&!AI.has(s.id)){AI.skills.push(s);msg('🌟 '+s.name+' 獲得')}
 if(!AI.quests.some(q=>!q.done))AI.quests.push(state.kills<12?{name:'討伐訓練',type:'kills',start:state.kills,goal:6,reward:220,done:false}:{name:'強敵討伐',type:'bossKills',start:state.bossKills,goal:1,reward:450,done:false});
 for(const q of AI.quests){if(q.done)continue;q.progress=(state[q.type]||0)-q.start;if(q.progress>=q.goal){q.done=true;state.gold+=q.reward;msg('✅ AIクエスト達成')}}
 if(Math.random()<.22)AI.event=['平穏','紅月','黄金探索期','魔物活性化'][Math.floor(Math.random()*4)];
 if(state.lv>=3&&state.kills>=8&&performance.now()-MYTHIC.lastSpawn>50000&&Math.random()<.18)spawnMythic();
};

let joy={x:0,y:0},touchAim={x:1,y:0};
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
const updStick=e=>{const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`};
stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);updStick(e)};stick.onpointermove=e=>{if(e.pointerId===sid)updStick(e)};const end=e=>{if(e.pointerId===sid){sid=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}};stick.onpointerup=end;stick.onpointercancel=end;

function nearest(r=120){let b=null,d0=1e9;for(const e of enemies){if(!e.alive)continue;const d=Math.hypot(player.x-e.x,player.y-e.y);if(d<r&&d<d0){d0=d;b=e}}return b}
function killEnemy(e){
 e.alive=false;state.kills++;state.xp+=e.mythic?240:e.boss?160:28;state.gold+=e.mythic?600:e.boss?380:35;if(e.boss)state.bossKills++;
 if(hasSkill('devour')){state.hp=Math.min(state.maxHp,state.hp+16);state.mp=Math.min(state.maxMp,state.mp+8)}
 if(e.mythic){MYTHIC.defeated.push(e.id);grantSkill(e.skill,e.name);MYTHIC.active=null}
 if(state.xp>=state.lv*100){state.xp-=state.lv*100;state.lv++;state.maxHp+=18;state.hp=state.maxHp;msg('⭐ LEVEL UP')}
 setTimeout(()=>{if(!e.mythic){e.x=player.x+(Math.random()>.5?1:-1)*(480+Math.random()*500);e.y=player.y+(Math.random()>.5?1:-1)*(480+Math.random()*500);e.hp=e.maxHp;e.alive=true}},5000+Math.random()*8000);
}
function damage(e,d){e.hp-=d;if(e.hp<=0)killEnemy(e)}
function attack(){profile.attacks++;player.attackAnim=.18;const e=nearest(105);if(!e)return msg('⚔️ 空振り');let d=state.atk+Math.floor(Math.random()*10);if(hasSkill('rune_eye')&&Math.random()<.16)d=Math.floor(d*1.8);if(hasSkill('lawless_flame')&&state.hp<state.maxHp*.3)d=Math.floor(d*1.45);if(e.boss&&hasSkill('dragon_origin'))d=Math.floor(d*1.22);damage(e,d);state.burst=Math.min(100,state.burst+10);touchAim.x=e.x-player.x;touchAim.y=e.y-player.y}
function skill(){const c=AI.has('arcane')?14:18;if(state.mp<c)return;profile.skills++;state.mp-=c;let h=0;for(const e of enemies)if(e.alive&&Math.hypot(player.x-e.x,player.y-e.y)<170){damage(e,60+state.lv*4);h++}msg('🔥 '+h+'体命中')}
function dodge(){if(state.st<20)return;profile.dodges++;state.st-=20;state.dodge=.42}
function special(){if(state.burst<100)return;state.burst=0;for(const e of enemies)if(e.alive&&Math.hypot(player.x-e.x,player.y-e.y)<220)damage(e,210+state.lv*10);msg('⚡ 神速奥義')}
document.getElementById('attackBtn').onclick=attack;document.getElementById('skillBtn').onclick=skill;document.getElementById('dodgeBtn').onclick=dodge;document.getElementById('guardBtn').onclick=()=>{profile.guards++;state.guard=!state.guard;msg(state.guard?'🛡️ 防御ON':'🛡️ 防御OFF')};document.getElementById('specialBtn').onclick=special;

document.getElementById('interactBtn').onclick=()=>{
 const cs=activeChunks();
 for(const c of cs){
  const chest=c.chests.find(ch=>!ch.opened&&Math.hypot(player.x-ch.x,player.y-ch.y)<65);
  if(chest){chest.opened=true;state.gold+=150;inventory[2].count++;return msg('🎁 宝箱：150G + 星晶石')}
  const n=c.npcs.find(n=>Math.hypot(player.x-n.x,player.y-n.y)<70);
  if(n)return msg('💬 '+n.name+'：この先には強い魔物がいる');
 }
 if(Math.random()<.55){inventory[1].count++;msg('⛏️ 鉄鉱石')}else{inventory[2].count++;msg('💎 星晶石')}
};

let menuTab='status';
function renderMenu(){
 const q=AI.quests.find(q=>!q.done);let body='';
 if(menuTab==='status')body=`<div class="row">Lv.${state.lv}<br>HP ${Math.ceil(state.hp)}/${state.maxHp}<br>MP ${Math.ceil(state.mp)}/${state.maxMp}<br>ATK ${state.atk}<br>所持金 ${state.gold}G<br>撃破 ${state.kills}</div>`;
 if(menuTab==='weapon')body=weapons.map(w=>`<div class="row">${weapon===w.id?'✅':'⚔️'} ${w.name} ATK ${w.atk}<button class="menuBtn2" onclick="window.equipW('${w.id}')">装備</button></div>`).join('');
 if(menuTab==='items')body=inventory.map(i=>`<div class="row">${i.name} ×${i.count}${i.id==='potion'?` <button class="menuBtn2" onclick="window.usePotion()">使う</button>`:''}</div>`).join('');
 if(menuTab==='job')body=`<div class="row">AI職業：${AI.job}<br>状態：${AI.mood}<br>イベント：${AI.event}</div>`;
 if(menuTab==='quest')body=`<div class="row quest">${q?`${q.name} ${(q.progress||0)}/${q.goal}<br>報酬 ${q.reward}G`:'なし'}</div>`;
 if(menuTab==='skills')body=(AI.skills.length?AI.skills.map(s=>`<div class="row skill">🌟 ${s.name}<br>${s.desc}</div>`).join(''):'<div class="row">未獲得</div>')+(MYTHIC.skills.length?MYTHIC.skills.map(s=>`<div class="row skill">🌌 ${s.name}<br>${s.desc}</div>`).join(''):'');
 menu.innerHTML=`<h3>☰ GAME MENU</h3><div id="menuTabs">${[['status','ステータス'],['weapon','武器'],['items','アイテム'],['job','職業'],['quest','クエスト'],['skills','スキル']].map(([id,n])=>`<button class="menuTab" onclick="window.tab('${id}')">${n}</button>`).join('')}</div>${body}<button class="menuBtn2" onclick="document.getElementById('gameMenu').classList.remove('open')">閉じる</button>`;
}
window.tab=x=>{menuTab=x;renderMenu()};window.equipW=id=>{weapon=id;state.atk=weapons.find(w=>w.id===id).atk;renderMenu()};window.usePotion=()=>{if(inventory[0].count<=0)return msg('回復薬なし');inventory[0].count--;state.hp=Math.min(state.maxHp,state.hp+85);renderMenu()};
function renderAI(){aiPanel.innerHTML=`<h3>🤖 AI WORLD MASTER</h3><div class="row">職業：${AI.job}<br>状態：${AI.mood}<br>難易度：${AI.difficulty.toFixed(2)}<br>イベント：${AI.event}</div><div class="row">神話級撃破：${MYTHIC.defeated.length}<br>神話スキル：${MYTHIC.skills.length}</div>`}
document.getElementById('menuBtn').onclick=()=>{menu.classList.toggle('open');renderMenu()};document.getElementById('diagBtn').onclick=()=>{diag.classList.toggle('open');renderDiag()};document.getElementById('aiBtn').onclick=()=>{aiPanel.classList.toggle('open');renderAI()};

const SAVE='yuusha_v24_2d_hd';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({state,player,profile,inventory,weapon,AI,MYTHIC:{defeated:MYTHIC.defeated,skills:MYTHIC.skills}}))}catch(_){}}function load(){try{const r=localStorage.getItem(SAVE);if(!r)return;const d=JSON.parse(r);Object.assign(state,d.state||{});Object.assign(player,d.player||{});Object.assign(profile,d.profile||{});if(Array.isArray(d.inventory)){inventory.splice(0,inventory.length,...d.inventory)}weapon=d.weapon||'sword';Object.assign(AI,d.AI||{});if(d.MYTHIC){MYTHIC.defeated=d.MYTHIC.defeated||[];MYTHIC.skills=d.MYTHIC.skills||[]}}catch(_){}}
load();setInterval(save,45000);addEventListener('pagehide',save);

function worldToScreen(x,y,camX,camY){return {x:(x-camX)+innerWidth/2,y:(y-camY)+innerHeight/2}}
function pixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawShadow(x,y,w,h){ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill()}
function drawPlayer(sx,sy){
 drawShadow(sx,sy+14,15,6);const bob=Math.sin(player.anim)*2,atk=player.attackAnim>0?8:0;
 pixelRect(sx-8,sy-12+bob,16,18,'#2d6bd1');pixelRect(sx-7,sy-24+bob,14,12,'#e2b783');
 pixelRect(sx-11,sy+5+bob,7,13,'#26384d');pixelRect(sx+4,sy+5+bob,7,13,'#26384d');
 pixelRect(sx-13,sy-10+bob,6,14,'#2d6bd1');pixelRect(sx+7,sy-10+bob,6,14,'#2d6bd1');
 pixelRect(sx+12+atk,sy-10+bob,3,18,'#dfe6eb');
 pixelRect(sx-4,sy-20+bob,3,2,'#27313b');pixelRect(sx+2,sy-20+bob,3,2,'#27313b');
}
function drawEnemy(e,sx,sy){
 drawShadow(sx,sy+10,e.size*.7,e.size*.25);ctx.fillStyle=e.color;ctx.fillRect(sx-e.size/2,sy-e.size/2,e.size,e.size);
 if(e.mythic){ctx.strokeStyle='#e8b7ff';ctx.lineWidth=2;ctx.strokeRect(sx-e.size/2-3,sy-e.size/2-3,e.size+6,e.size+6)}
 ctx.fillStyle='#fff';ctx.fillRect(sx-6,sy-5,4,3);ctx.fillRect(sx+2,sy-5,4,3);
}
function drawWorld(camX,camY){
 const biome=biomeAt(player.x,player.y);
 ctx.fillStyle=biome.ground;ctx.fillRect(0,0,innerWidth,innerHeight);
 const grid=64,ox=(((-camX+innerWidth/2)%grid)+grid)%grid,oy=(((-camY+innerHeight/2)%grid)+grid)%grid;
 ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=1;for(let x=ox;x<innerWidth;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,innerHeight);ctx.stroke()}for(let y=oy;y<innerHeight;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke()}
 for(const c of activeChunks()){
  for(const it of c.items){const s=worldToScreen(it.x,it.y,camX,camY);if(s.x<-50||s.y<-50||s.x>innerWidth+50||s.y>innerHeight+50)continue;if(it.type==='tree'){drawShadow(s.x,s.y+12,13,5);pixelRect(s.x-4,s.y-5,8,24,'#66482f');pixelRect(s.x-16,s.y-28,32,28,biome.tree)}else if(it.type==='rock'){drawShadow(s.x,s.y+7,10,4);pixelRect(s.x-10,s.y-7,20,14,'#747b7f')}else{pixelRect(s.x-2,s.y-2,4,4,'#f3d36a')}}
  for(const ch of c.chests)if(!ch.opened){const s=worldToScreen(ch.x,ch.y,camX,camY);pixelRect(s.x-10,s.y-7,20,14,'#9a5c1c');pixelRect(s.x-2,s.y-7,4,14,'#d4aa4c')}
  for(const n of c.npcs){const s=worldToScreen(n.x,n.y,camX,camY);drawShadow(s.x,s.y+10,10,4);pixelRect(s.x-8,s.y-15,16,22,'#8a5ca8');pixelRect(s.x-6,s.y-25,12,10,'#dfb184')}
 }
 for(const e of enemies){if(!e.alive)continue;const s=worldToScreen(e.x,e.y,camX,camY);if(s.x<-70||s.y<-70||s.x>innerWidth+70||s.y>innerHeight+70)continue;drawEnemy(e,s.x,s.y)}
 const p=worldToScreen(player.x,player.y,camX,camY);drawPlayer(p.x,p.y);
}
let worldTime=480,weather='clear',weatherTimer=35,lastBiome='',last=performance.now(),frames=0,fpsT=last;
function update(dt){
 state.dodge=Math.max(0,state.dodge-dt);state.st=Math.min(state.maxSt,state.st+24*dt);state.mp=Math.min(state.maxMp,state.mp+4*dt);player.attackAnim=Math.max(0,player.attackAnim-dt);
 const m=Math.hypot(joy.x,joy.y);if(m>.05){const sp=state.dodge>0?(AI.has('afterimage')?230:195):125;player.x+=joy.x/m*sp*dt;player.y+=joy.y/m*sp*dt;player.anim+=dt*9}else player.anim+=dt*2;
 for(const e of enemies){if(!e.alive)continue;e.cd=Math.max(0,e.cd-dt);const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);if(d>35&&d<500){e.x+=dx/d*e.speed*AI.difficulty*dt;e.y+=dy/d*e.speed*AI.difficulty*dt}if(d<42&&e.cd<=0){e.cd=e.boss?1.1:1.7;if(state.dodge<=0){let dm=Math.floor(e.atk*AI.difficulty);if(state.guard)dm=Math.floor(dm*(AI.has('ironwall')?.35:.5));state.hp-=dm;profile.damageTaken+=dm;if(state.hp<=0){state.hp=state.maxHp;state.mp=state.maxMp;player.x=player.y=0;msg('💫 王都へ帰還')}}}}
 maintainEnemies();AI.last+=dt;if(AI.last>5){AI.last=0;AI.analyze();renderAI()}
 worldTime=(worldTime+dt*4)%1440;weatherTimer-=dt;if(weatherTimer<=0){weatherTimer=30+Math.random()*30;weather=['clear','clear','rain','fog'][Math.floor(Math.random()*4)]}
 if(hasSkill('sun_core')&&worldTime/60>=6&&worldTime/60<=18)state.hp=Math.min(state.maxHp,state.hp+1.2*dt);
 const b=biomeAt(player.x,player.y);if(b.name!==lastBiome){lastBiome=b.name;zoneEl.textContent=b.name;zoneEl.style.display='block';setTimeout(()=>zoneEl.style.display='none',1500)}
}
function drawWeather(){
 if(weather==='rain'){ctx.strokeStyle='rgba(180,220,255,.45)';for(let i=0;i<60;i++){const x=(i*97+performance.now()*.22)%innerWidth,y=(i*53+performance.now()*.45)%innerHeight;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+12);ctx.stroke()}}
 if(weather==='fog'){ctx.fillStyle='rgba(220,230,230,.16)';ctx.fillRect(0,0,innerWidth,innerHeight)}
 const hr=worldTime/60;if(hr<6||hr>19){ctx.fillStyle='rgba(8,16,38,.38)';ctx.fillRect(0,0,innerWidth,innerHeight)}
}
function render(){
 const now=performance.now(),dt=Math.min(.033,(now-last)/1000);last=now;frames++;if(now-fpsT>=1000){perf.textContent='FPS '+Math.round(frames*1000/(now-fpsT));frames=0;fpsT=now}
 update(dt);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
 drawWorld(player.x,player.y);drawWeather();
 hud.innerHTML=`Lv.${state.lv}　💰${state.gold}G<br>❤️ <span class="bar"><span class="fill hp" style="width:${state.hp/state.maxHp*100}%"></span></span> ${Math.ceil(state.hp)}<br>💧 <span class="bar"><span class="fill mp" style="width:${state.mp/state.maxMp*100}%"></span></span><br>🟢 <span class="bar"><span class="fill st" style="width:${state.st/state.maxSt*100}%"></span></span><br>⭐ <span class="bar"><span class="fill xp" style="width:${state.xp/(state.lv*100)*100}%"></span></span><br>⚔️ ${weapons.find(w=>w.id===weapon).name}　⚡${Math.floor(state.burst)}%`;
 const q=AI.quests.find(q=>!q.done);objective.textContent=q?`目的：${q.name} ${(q.progress||0)}/${q.goal}`:'目的：自由探索';
 aiChip.textContent=`🤖 ${AI.job} / ${AI.mood} / 神話${MYTHIC.defeated.length}`;
 const hr=worldTime/60;eventChip.textContent=`${weather==='rain'?'🌧️ 雨':weather==='fog'?'🌫️ 霧':'🌤️ 晴れ'} / ${hr<6||hr>19?'夜':'昼'} / ${AI.event}`;
 const boss=MYTHIC.active?.alive?MYTHIC.active:enemies.find(e=>e.alive&&e.boss&&Math.hypot(player.x-e.x,player.y-e.y)<500);if(boss){bossHUD.style.display='block';bossName.textContent=boss.name;bossFill.style.width=(boss.hp/boss.maxHp*100)+'%'}else bossHUD.style.display='none';
 requestAnimationFrame(render);
}
document.getElementById('startBtn').onclick=()=>{document.getElementById('titleScreen').style.display='none';msg('⚔️ 冒険開始')};
renderDiag();renderMenu();renderAI();render();
})();
</script>
