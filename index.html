<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>勇者の冒険 REAL v22 LIVING WORLD 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:rgba(7,12,18,.76);border:1px solid rgba(255,255,255,.14);border-radius:13px;backdrop-filter:blur(8px)}
#hud{position:fixed;left:10px;top:max(10px,env(safe-area-inset-top));z-index:20;padding:8px 10px;min-width:200px;font-size:11px;line-height:1.4}
.bar{display:inline-block;width:88px;height:7px;background:#ffffff18;border-radius:10px;overflow:hidden;vertical-align:middle}
.fill{display:block;height:100%}.hp{background:#ff675f}.mp{background:#59b9ff}.st{background:#7ada76}.xp{background:#e4bf5f}
#objective{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:20;padding:6px 9px;font-size:10px;max-width:58vw;text-align:center}
#aiChip{position:fixed;left:50%;top:46px;transform:translateX(-50%);z-index:20;padding:5px 8px;font-size:9px;max-width:62vw;text-align:center}
#mini{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:20;width:78px;height:78px}
#message{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:30;padding:7px 10px;font-size:11px;opacity:0;transition:opacity .2s;min-width:170px;text-align:center}
#message.show{opacity:1}
#stick{position:fixed;left:18px;bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));z-index:26;width:114px;height:114px;border-radius:50%;border:1px solid #ffffff35;background:#ffffff10}
#knob{position:absolute;left:32px;top:32px;width:50px;height:50px;border-radius:50%;background:#ffffff35;border:1px solid #ffffff4c}
#actions{position:fixed;right:12px;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));z-index:26;display:grid;grid-template-columns:repeat(3,48px);gap:6px}
.action{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff30;background:#132130;color:#fff;font-size:8px;font-weight:700}
.action b{display:block;font-size:17px}
#menuBtn,#diagBtn,#aiBtn{position:fixed;right:10px;z-index:28;width:42px;height:42px;border:0;border-radius:11px;background:#101923;color:#fff;font-size:19px}
#menuBtn{top:98px}#diagBtn{top:146px}#aiBtn{top:194px}
#gameMenu,#diag,#aiPanel{display:none;position:fixed;left:50%;top:11%;transform:translateX(-50%);z-index:60;width:min(92vw,560px);max-height:74vh;overflow:auto;padding:14px}
#gameMenu.open,#diag.open,#aiPanel.open{display:block}
#menuTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.menuTab,.menuBtn2{padding:8px 7px;border:1px solid #ffffff20;border-radius:9px;background:#14202d;color:#fff;font-size:10px}
.row{padding:8px 0;border-bottom:1px solid #ffffff12;font-size:11px}
.skill{color:#8fffd4;font-weight:800}
.quest{color:#ffd97a}
#boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#061019}
#bootCard{width:min(90vw,430px);padding:18px}
#bootStatus{font-size:11px;line-height:1.65;white-space:pre-line}
#bootError{display:none;margin-top:10px;padding:10px;border:1px solid #ff6b79;background:#3b1016;border-radius:10px;font-size:10px;white-space:pre-wrap}
#zone{display:none;position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:34;padding:10px 15px;font-size:17px;font-weight:800}
#boss{display:none;position:fixed;left:50%;top:86px;transform:translateX(-50%);z-index:25;width:min(76vw,560px);padding:8px 10px;text-align:center}
#boss .bar{width:75%}
#telegraph{display:none;position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:35;padding:7px 10px;font-size:11px;border-color:#ff6a6a88}
#quickHeal{position:fixed;right:14px;bottom:180px;z-index:27;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff30;background:#10202c;color:#fff;font-size:18px}
#perf{position:fixed;left:8px;bottom:8px;z-index:18;padding:4px 6px;font-size:8px;opacity:.65}
#backendInput{width:100%;padding:8px;border-radius:8px;border:1px solid #ffffff20;background:#0e1822;color:#fff}
@media(max-width:700px){
 #hud{min-width:180px;font-size:10px}.bar{width:76px}
 #actions{grid-template-columns:repeat(3,45px)}.action{width:45px;height:45px}
 #stick{width:108px;height:108px}#knob{left:30px;top:30px;width:48px;height:48px}
 #menuBtn{top:92px}#diagBtn{top:140px}#aiBtn{top:188px}
}
</style>
</head>
<body>
<div id="boot"><div id="bootCard" class="panel"><h3>REAL v22 LIVING WORLD 3D</h3><div id="bootStatus">起動準備中…</div><div id="bootError"></div></div></div>

<canvas id="game"></canvas>
<canvas id="mini" class="panel"></canvas>
<div id="hud" class="panel"></div>
<div id="objective" class="panel">目的：世界を起動する</div>
<div id="aiChip" class="panel">🤖 LOCAL AI WORLD MASTER</div>
<div id="message" class="panel"></div>
<div id="zone" class="panel"></div>
<div id="boss" class="panel"><div id="bossName"></div><div class="bar"><span id="bossFill" class="fill hp" style="width:100%"></span></div></div>
<div id="telegraph" class="panel"></div>
<div id="perf" class="panel">FPS --</div>

<button id="menuBtn">☰</button>
<button id="diagBtn">🛠️</button>
<button id="aiBtn">🤖</button>
<button id="quickHeal">🧪</button>

<div id="gameMenu" class="panel"></div>
<div id="diag" class="panel"></div>
<div id="aiPanel" class="panel"></div>

<div id="stick"><div id="knob"></div></div>
<div id="actions">
  <button class="action" id="attackBtn"><b>⚔️</b>攻撃</button>
  <button class="action" id="skillBtn"><b>🔥</b>技</button>
  <button class="action" id="dodgeBtn"><b>💨</b>回避</button>
  <button class="action" id="guardBtn"><b>🛡️</b>防御</button>
  <button class="action" id="interactBtn"><b>💬</b>調べる</button>
  <button class="action" id="specialBtn"><b>⚡</b>必殺</button>
</div>

<script>
window.V22_ERRORS=[];
window.addEventListener('error',e=>window.V22_ERRORS.push({t:Date.now(),m:e.message||'error'}));
window.addEventListener('unhandledrejection',e=>window.V22_ERRORS.push({t:Date.now(),m:String(e.reason||'promise')}));
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';

const boot=document.getElementById('boot'),bootStatus=document.getElementById('bootStatus'),bootError=document.getElementById('bootError');
const diag=document.getElementById('diag'),gameMenu=document.getElementById('gameMenu'),aiPanel=document.getElementById('aiPanel');
const messageEl=document.getElementById('message'),objective=document.getElementById('objective'),aiChip=document.getElementById('aiChip');
const bossBox=document.getElementById('boss'),bossName=document.getElementById('bossName'),bossFill=document.getElementById('bossFill'),telegraph=document.getElementById('telegraph');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');

const SYSTEMS=['Three.js','Renderer','World','Player','GLB Player','Animation','Camera','Controls','Enemies','Bosses','Combat','Items','Crafting','NPC','Local AI','Backend AI','Save','SELF HEAL'];
const SYS=new Map(SYSTEMS.map(x=>[x,{state:'pending',message:''}]));
function renderDiag(){
 diag.innerHTML='<h3>🛠️ SYSTEM DIAGNOSTIC</h3>'+[...SYS.entries()].map(([k,v])=>`<div class="row">${v.state==='ok'?'✅':v.state==='fail'?'❌':'⏳'} ${k}${v.message?`<br><small>${v.message}</small>`:''}</div>`).join('')+
 `<div class="row">Runtime errors: ${window.V22_ERRORS.length}</div><button class="menuBtn2" onclick="location.reload()">再起動</button>`;
}
function setSys(k,state,message=''){SYS.set(k,{state,message});renderDiag();bootStatus.textContent=[...SYS.entries()].map(([n,v])=>`${v.state==='ok'?'✅':v.state==='fail'?'❌':'⏳'} ${n}${v.message?' - '+v.message:''}`).join('\n')}
function msg(t){messageEl.textContent=t;messageEl.classList.add('show');clearTimeout(msg._t);msg._t=setTimeout(()=>messageEl.classList.remove('show'),1900)}
function selfHeal(name,fn,fallback=null){try{return fn()}catch(e){setSys(name,'fail',e.message);window.V22_ERRORS.push({t:Date.now(),m:name+': '+e.message});return fallback}}

setSys('Three.js','ok','r'+THREE.REVISION);

const renderer=selfHeal('Renderer',()=>{
 const r=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true,powerPreference:'high-performance'});
 r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight,false);
 r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.02;
 setSys('Renderer','ok');return r;
});
if(!renderer){bootError.style.display='block';bootError.textContent='WebGL Rendererを作れませんでした';throw new Error('renderer')}

const scene=selfHeal('World',()=>{
 const s=new THREE.Scene();s.background=new THREE.Color(0x83bce4);s.fog=new THREE.Fog(0x91bdd2,38,110);
 s.add(new THREE.HemisphereLight(0xdff4ff,0x324129,1.35));
 const sun=new THREE.DirectionalLight(0xfff0d2,2.1);sun.position.set(30,45,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;s.add(sun);
 setSys('World','ok');return {scene:s,sun};
});
const sun=scene.sun, worldScene=scene.scene;

const world=new THREE.Group();worldScene.add(world);
const mat=(c,r=.9,m=.02)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180,1,1),mat(0x557f47,.95));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);

const REGIONS=[
 {id:'plains',name:'草原王国',x0:-45,x1:15,z0:-45,z1:20,color:0x5e8e4d},
 {id:'forest',name:'古代森林',x0:-70,x1:-15,z0:-10,z1:65,color:0x386b3d},
 {id:'volcano',name:'火山荒野',x0:15,x1:75,z0:-55,z1:15,color:0x73513d},
 {id:'snow',name:'雪原',x0:-35,x1:30,z0:20,z1:75,color:0xcbdde4},
 {id:'mountain',name:'禁足山岳',x0:25,x1:80,z0:15,z1:80,color:0x70777a}
];
function regionAt(x,z){return REGIONS.find(r=>x>=r.x0&&x<=r.x1&&z>=r.z0&&z<=r.z1)||REGIONS[0]}
function createLandmarks(){
 for(let i=0;i<75;i++){
  const x=Math.random()*150-75,z=Math.random()*150-75,r=regionAt(x,z);
  if(Math.hypot(x,z)<8)continue;
  if(r.id==='forest'||(r.id==='plains'&&Math.random()<.45)){
   const g=new THREE.Group();
   const t=new THREE.Mesh(new THREE.CylinderGeometry(.23,.34,2.5,6),mat(0x694a2e));t.position.y=1.25;t.castShadow=true;g.add(t);
   const l=new THREE.Mesh(new THREE.ConeGeometry(1.2,3.3,7),mat(r.id==='snow'?0xbfd8ca:0x2f6738));l.position.y=3.1;l.castShadow=true;g.add(l);g.position.set(x,0,z);world.add(g);
  }else{
   const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*.9),mat(r.id==='volcano'?0x5e4b45:0x74797b,1));rock.position.set(x,.55,z);rock.scale.y=.65;rock.castShadow=true;rock.receiveShadow=true;world.add(rock);
  }
 }
 // town
 for(let h=0;h<4;h++){
  const house=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(3,2,3),mat(0x9a7654));b.position.y=1;b.castShadow=true;house.add(b);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(2.5,1.8,4),mat(0x5c3b2f));roof.position.y=2.9;roof.rotation.y=Math.PI/4;roof.castShadow=true;house.add(roof);
  house.position.set(6+h*5,0,-6+(h%2)*5);world.add(house);
 }
}
createLandmarks();

const gltf=new GLTFLoader();
const mixers=[];
const MODEL_PATHS={
 player:'./assets/models/player.glb',
 enemy:'./assets/models/enemy.glb',
 boss:'./assets/models/boss.glb'
};

function fallbackHumanoid(color=0x2d6cd8,scale=1){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.95,8,14),mat(color,.65));body.position.y=1.15;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.38,14,10),mat(0xe1b78c,.8));head.position.y=2.15;head.castShadow=true;g.add(head);
 const legG=new THREE.BoxGeometry(.22,.8,.24),armG=new THREE.BoxGeometry(.18,.78,.2);
 const ll=new THREE.Mesh(legG,mat(0x283546)),rl=ll.clone(),la=new THREE.Mesh(armG,mat(color,.65)),ra=la.clone();
 ll.position.set(-.2,.52,0);rl.position.set(.2,.52,0);la.position.set(-.52,1.35,0);ra.position.set(.52,1.35,0);
 g.add(ll,rl,la,ra);g.scale.setScalar(scale);g.userData.parts={ll,rl,la,ra};return g;
}

const player=new THREE.Group();worldScene.add(player);
let playerVisual=fallbackHumanoid();player.add(playerVisual);
setSys('Player','ok','fallback ready');
let playerMixer=null,playerActions={},animState='idle';
function bindAnimations(root,clips){
 if(!clips?.length)return;
 playerMixer=new THREE.AnimationMixer(root);mixers.push(playerMixer);
 for(const c of clips)playerActions[c.name.toLowerCase()]=playerMixer.clipAction(c);
}
function playAnim(name){
 if(!playerMixer)return;
 const key=Object.keys(playerActions).find(k=>k.includes(name));
 if(!key||animState===key)return;
 Object.values(playerActions).forEach(a=>a.fadeOut(.12));
 playerActions[key].reset().fadeIn(.12).play();animState=key;
}
gltf.load(MODEL_PATHS.player,g=>{
 player.clear();playerVisual=g.scene;playerVisual.scale.setScalar(1.2);player.add(playerVisual);
 playerVisual.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 bindAnimations(playerVisual,g.animations);
 setSys('GLB Player','ok',g.animations.length?`${g.animations.length} clips`:'model loaded');
 setSys('Animation','ok',g.animations.length?'GLTF clips':'fallback procedural');
},undefined,()=>{
 setSys('GLB Player','ok','asset未配置 → fallback');
 setSys('Animation','ok','procedural fallback');
});

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,220);camera.position.set(0,5.5,7.5);setSys('Camera','ok');
let yaw=0,pitch=.42,camDist=6.9,joy={x:0,y:0},drag=false,lastX=0,lastY=0;
const SETTINGS={camera:1,quality:'auto',sound:true};
function setupControls(){
 const stick=document.getElementById('stick'),knob=document.getElementById('knob'),canvas=document.getElementById('game');let sid=null;
 const upd=e=>{const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`};
 stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);upd(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)upd(e)});
 const end=e=>{if(e.pointerId===sid){sid=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}};stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
 canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006*SETTINGS.camera;pitch=Math.max(.12,Math.min(1.02,pitch+dy*.0045*SETTINGS.camera))});
 canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
 setSys('Controls','ok');
}
setupControls();

const state={lv:1,xp:0,hp:220,maxHp:220,mp:110,maxMp:110,st:110,maxSt:110,gold:250,atk:28,burst:0,guard:false,dodge:0,attackCd:0,skillCd:0,kills:0,bossKills:0,uniqueKills:0,title:'駆け出し'};
const profile={attacks:0,skills:0,dodges:0,guards:0,parries:0,heals:0,damageTaken:0,weaponUse:{sword:0,greatsword:0,spear:0,bow:0,staff:0}};
const inventory=[
 {id:'potion',name:'回復薬',type:'consumable',count:4},
 {id:'ether',name:'魔力薬',type:'consumable',count:2},
 {id:'ore',name:'鉄鉱石',type:'material',count:0},
 {id:'crystal',name:'星晶石',type:'material',count:0}
];
const weapons=[
 {id:'sword',name:'片手剣',atk:28,skill:'旋風斬'},
 {id:'greatsword',name:'大剣',atk:38,skill:'地裂斬'},
 {id:'spear',name:'槍',atk:32,skill:'貫通突き'},
 {id:'bow',name:'弓',atk:25,skill:'三連射'},
 {id:'staff',name:'杖',atk:23,skill:'爆炎魔法'}
];
let weapon='sword';

const enemies=[];
function addEnemy(type,x,z,boss=false,unique=false){
 const v=fallbackHumanoid(boss?0x7e2630:type==='wolf'?0x4b5560:0x8e5944,boss?1.55:.82);v.position.set(x,0,z);worldScene.add(v);
 const e={type,name:boss?(unique?'月蝕獣ネブラ':'獄炎王ヴァルガ'):type==='wolf'?'影狼':'オーク',obj:v,hp:boss?(unique?1800:1100):type==='wolf'?120:190,maxHp:boss?(unique?1800:1100):type==='wolf'?120:190,atk:boss?34:type==='wolf'?14:20,speed:boss?1.45:type==='wolf'?2.0:1.45,boss,unique,alive:true,cd:0,wind:0,phase:1};
 enemies.push(e);return e;
}
for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,r=10+Math.random()*45;addEnemy(i%3?'wolf':'orc',Math.cos(a)*r,Math.sin(a)*r)}
const mainBoss=addEnemy('boss',0,-32,true,false);
const uniqueBoss=addEnemy('unique',-46,42,true,true);uniqueBoss.alive=false;uniqueBoss.obj.visible=false;
setSys('Enemies','ok',`${enemies.length} entities`);
setSys('Bosses','ok','phase / unique');

function nearest(range=3){let b=null,d0=999;for(const e of enemies){if(!e.alive)continue;const d=player.position.distanceTo(e.obj.position);if(d<range&&d<d0){b=e;d0=d}}return b}
function hitEnemy(e,dmg){
 e.hp-=dmg;
 if(e.hp<=e.maxHp*.65&&e.phase===1&&e.boss){e.phase=2;e.atk+=7;e.speed*=1.15;msg('⚠️ '+e.name+' PHASE 2')}
 if(e.hp<=e.maxHp*.28&&e.phase===2&&e.boss){e.phase=3;e.atk+=10;e.speed*=1.12;msg('⚠️ '+e.name+' FINAL PHASE')}
 if(e.hp<=0){
  e.alive=false;e.obj.visible=false;state.kills++;state.gold+=e.boss?450:45;state.xp+=e.boss?180:35;
  if(e.boss)state.bossKills++;if(e.unique)state.uniqueKills++;
  msg(e.unique?'🌟 UNIQUE DEFEATED':e.boss?'🏆 BOSS DEFEATED':'⚔️ ENEMY DEFEATED');
  if(state.xp>=state.lv*100){state.xp-=state.lv*100;state.lv++;state.maxHp+=18;state.hp=state.maxHp;msg('⭐ LEVEL UP')}
 }
}
function currentWeapon(){return weapons.find(w=>w.id===weapon)}
function attack(){
 if(state.attackCd>0)return;profile.attacks++;profile.weaponUse[weapon]++;state.attackCd=.3;
 const e=nearest(weapon==='bow'||weapon==='staff'?8:3.1);if(!e)return msg('⚔️ 空振り');
 let dmg=currentWeapon().atk+state.lv*3+Math.floor(Math.random()*9);if(AI.hasSkill('laststand')&&state.hp<state.maxHp*.3)dmg=Math.floor(dmg*1.35);if(e.boss&&AI.hasSkill('slayer'))dmg=Math.floor(dmg*1.2);
 hitEnemy(e,dmg);state.burst=Math.min(100,state.burst+10);playAnim('attack');msg(`⚔️ ${dmg}ダメージ`);
}
function skill(){
 if(state.skillCd>0)return;const cost=AI.hasSkill('arcane')?14:18;if(state.mp<cost)return;state.mp-=cost;state.skillCd=1.25;profile.skills++;
 let hit=0;for(const e of enemies)if(e.alive&&player.position.distanceTo(e.obj.position)<(weapon==='bow'||weapon==='staff'?10:5)){hitEnemy(e,currentWeapon().atk+42+state.lv*4);hit++}
 msg(`🔥 ${currentWeapon().skill} ${hit}体命中`);
}
function dodge(){if(state.st<20)return;profile.dodges++;state.st-=20;state.dodge=.45;playAnim('dodge');msg('💨 回避')}
function toggleGuard(){profile.guards++;state.guard=!state.guard;msg(state.guard?'🛡️ 防御ON':'🛡️ 防御OFF')}
function special(){if(state.burst<100)return;state.burst=0;for(const e of enemies)if(e.alive&&player.position.distanceTo(e.obj.position)<8)hitEnemy(e,190+state.lv*12);msg('⚡ 必殺「天翔断」')}
function useItem(id){
 const it=inventory.find(i=>i.id===id);if(!it||it.count<=0)return msg('アイテムなし');
 if(id==='potion')state.hp=Math.min(state.maxHp,state.hp+85);if(id==='ether')state.mp=Math.min(state.maxMp,state.mp+60);it.count--;msg('🎒 '+it.name+'使用');
}
setSys('Combat','ok');
setSys('Items','ok');
setSys('Crafting','ok','material / simple craft');

const NPCS=[];
function addNPC(name,x,z,color=0xd5aa68){
 const v=fallbackHumanoid(color,.75);v.position.set(x,0,z);worldScene.add(v);NPCS.push({name,obj:v,friend:0});return v;
}
addNPC('王都長老',7,-5);addNPC('鍛冶師ガンツ',12,-1,0x87929d);addNPC('星読みミラ',-6,8,0x916dc2);
setSys('NPC','ok');

const AI={
 mode:'local',job:'冒険者',mood:'balanced',difficulty:1,event:'none',skills:[],quests:[],history:[],last:0,
 backendUrl:localStorage.getItem('yuusha_v22_backend')||'',backendConnected:false,
 hasSkill(id){return this.skills.some(s=>s.id===id)},
 analyze(){
  if(profile.dodges>profile.guards+5)this.job='影走士';else if(profile.guards>=10)this.job='境界守護者';else if(profile.skills>=15)this.job='魔剣士';else if(state.bossKills>=2)this.job='討滅士';else this.job='冒険者';
  const hpRate=state.hp/state.maxHp;if(hpRate<.35||profile.damageTaken>300){this.mood='support';this.difficulty=Math.max(.75,this.difficulty-.04)}else if(state.kills>12&&hpRate>.7){this.mood='challenge';this.difficulty=Math.min(1.5,this.difficulty+.04)}else{this.mood='balanced';this.difficulty+=(1-this.difficulty)*.2}
  const defs=[
   {id:'afterimage',name:'残影の境地',desc:'回避後の移動速度上昇',ok:profile.dodges>=12},
   {id:'ironwall',name:'鉄壁反射',desc:'防御中の被ダメージ軽減',ok:profile.guards>=10},
   {id:'arcane',name:'魔力循環',desc:'スキル消費MP低下',ok:profile.skills>=18},
   {id:'slayer',name:'討滅者',desc:'ボスへのダメージ上昇',ok:state.bossKills>=2},
   {id:'laststand',name:'逆境覚醒',desc:'瀕死時攻撃力上昇',ok:profile.damageTaken>=380}
  ];
  for(const d of defs)if(d.ok&&!this.hasSkill(d.id)){this.skills.push(d);msg('🌟 '+d.name+'獲得')}
  if(!this.quests.some(q=>!q.done)){const q=state.kills<10?{name:'討伐訓練',type:'kills',start:state.kills,goal:5,reward:180,done:false}:{name:'ボス調査',type:'bossKills',start:state.bossKills,goal:1,reward:350,done:false};this.quests.unshift(q);msg('📜 AIクエスト '+q.name)}
  for(const q of this.quests){if(q.done)continue;const v=(state[q.type]||0)-q.start;q.progress=Math.max(0,v);if(q.progress>=q.goal){q.done=true;state.gold+=q.reward;msg('✅ '+q.name+'達成')}}
  if(Math.random()<.22)this.event=['紅月','静穏期','黄金探索期','魔物活性化'][Math.floor(Math.random()*4)];
  if(state.lv>=5&&player.position.x<-35&&player.position.z>32&&!uniqueBoss.alive){uniqueBoss.alive=true;uniqueBoss.obj.visible=true;uniqueBoss.hp=uniqueBoss.maxHp;msg('🌟 UNIQUE MONSTER APPEARED')}
  this.history.unshift(`${new Date().toLocaleTimeString()} ${this.job}/${this.mood}/${this.event}`);this.history=this.history.slice(0,15);
 },
 async backend(requestType='game_master'){
  if(!this.backendUrl)return null;
  try{
   const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),4000);
   const r=await fetch(this.backendUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:requestType,player:{level:state.lv,job:this.job,kills:state.kills,bossKills:state.bossKills,weapon},world:{region:regionAt(player.position.x,player.position.z).id,event:this.event}}),signal:ctrl.signal});
   if(!r.ok)throw new Error('HTTP '+r.status);this.backendConnected=true;this.mode='backend';setSys('Backend AI','ok','connected');return await r.json();
  }catch(e){this.backendConnected=false;this.mode='local';setSys('Backend AI','ok','offline → local fallback');return null}
 }
};
setSys('Local AI','ok');
setSys('Backend AI','ok','optional / local fallback');

function interact(){
 const npc=NPCS.find(n=>player.position.distanceTo(n.obj.position)<3);
 if(npc){
  if(AI.backendConnected){AI.backend('npc').then(d=>msg(d?.npcLine||`${npc.name}：気をつけて行け`))}else msg(`${npc.name}：${AI.event==='紅月'?'今夜は空が赤い…':'旅人よ、北には強敵がいる'}`);
  npc.friend++;return;
 }
 // gather
 if(Math.random()<.5){inventory.find(i=>i.id==='ore').count++;msg('⛏️ 鉄鉱石を発見')}else{inventory.find(i=>i.id==='crystal').count++;msg('💎 星晶石を発見')}
}

const SAVE_KEY='yuusha_v22_living_world';
function snapshot(){return {state,profile,inventory,weapon,AI:{...AI,backend:undefined},pos:{x:player.position.x,y:player.position.y,z:player.position.z},yaw,pitch,enemies:enemies.map(e=>({hp:e.hp,alive:e.alive,phase:e.phase}))}}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));msg('💾 セーブ')}catch(e){window.V22_ERRORS.push({t:Date.now(),m:e.message})}}
function loadGame(){
 const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;
 try{const d=JSON.parse(raw);Object.assign(state,d.state||{});Object.assign(profile,d.profile||{});if(Array.isArray(d.inventory)){inventory.splice(0,inventory.length,...d.inventory)}weapon=d.weapon||'sword';if(d.AI){AI.job=d.AI.job||AI.job;AI.mood=d.AI.mood||AI.mood;AI.difficulty=d.AI.difficulty||1;AI.event=d.AI.event||'none';AI.skills=d.AI.skills||[];AI.quests=d.AI.quests||[];AI.history=d.AI.history||[]}if(d.pos)player.position.set(d.pos.x||0,d.pos.y||0,d.pos.z||0);yaw=d.yaw||0;pitch=d.pitch||.42;if(Array.isArray(d.enemies))d.enemies.forEach((v,i)=>{if(enemies[i]){enemies[i].hp=v.hp;enemies[i].alive=!!v.alive;enemies[i].phase=v.phase||1;enemies[i].obj.visible=enemies[i].alive}})}catch(e){window.V22_ERRORS.push({t:Date.now(),m:'load '+e.message})}
}
loadGame();setInterval(saveGame,45000);addEventListener('pagehide',saveGame);setSys('Save','ok');setSys('SELF HEAL','ok');

const AUDIO={ctx:null,enabled:true,beep(f=440,d=.06){if(!this.enabled)return;try{this.ctx=this.ctx||new (AudioContext||webkitAudioContext)();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+d);o.stop(this.ctx.currentTime+d)}catch(_){}}};

document.getElementById('attackBtn').onclick=()=>{AUDIO.beep(220);attack()};
document.getElementById('skillBtn').onclick=()=>{AUDIO.beep(520);skill()};
document.getElementById('dodgeBtn').onclick=dodge;
document.getElementById('guardBtn').onclick=toggleGuard;
document.getElementById('interactBtn').onclick=interact;
document.getElementById('specialBtn').onclick=special;
document.getElementById('quickHeal').onclick=()=>useItem('potion');
document.getElementById('diagBtn').onclick=()=>diag.classList.toggle('open');
document.getElementById('aiBtn').onclick=()=>{aiPanel.classList.toggle('open');renderAI()};
document.getElementById('menuBtn').onclick=()=>{gameMenu.classList.toggle('open');renderMenu()};

let menuTab='status';
function renderMenu(){
 const tabs=[['status','ステータス'],['weapon','武器'],['items','アイテム'],['job','職業'],['quest','クエスト'],['skills','スキル'],['craft','クラフト'],['save','セーブ'],['settings','設定']];
 let body='';
 if(menuTab==='status')body=`<div class="row">Lv.${state.lv}<br>HP ${Math.ceil(state.hp)}/${state.maxHp}<br>MP ${Math.ceil(state.mp)}/${state.maxMp}<br>攻撃 ${state.atk}<br>所持金 ${state.gold}G<br>称号 ${state.title}</div>`;
 if(menuTab==='weapon')body=weapons.map(w=>`<div class="row">${weapon===w.id?'✅':'⚔️'} ${w.name} ATK ${w.atk}<button class="menuBtn2" onclick="window.equipW('${w.id}')">装備</button></div>`).join('');
 if(menuTab==='items')body=inventory.map(i=>`<div class="row">${i.name} ×${i.count}${i.type==='consumable'?` <button class="menuBtn2" onclick="window.useI('${i.id}')">使う</button>`:''}</div>`).join('');
 if(menuTab==='job')body=`<div class="row">🤖 AI職業：${AI.job}<br>世界状態：${AI.mood}<br>イベント：${AI.event}</div>`;
 if(menuTab==='quest'){const q=AI.quests.find(q=>!q.done);body=`<div class="row quest">${q?`${q.name} ${(q.progress||0)}/${q.goal} 報酬${q.reward}G`:'現在のクエストなし'}</div>`}
 if(menuTab==='skills')body=AI.skills.length?AI.skills.map(s=>`<div class="row skill">🌟 ${s.name}<br>${s.desc}</div>`).join(''):'<div class="row">ユニークスキル未獲得</div>';
 if(menuTab==='craft'){const ore=inventory.find(i=>i.id==='ore'),cr=inventory.find(i=>i.id==='crystal');body=`<div class="row">鉄鉱石 ${ore.count} / 星晶石 ${cr.count}</div><div class="row">強化剣 <button class="menuBtn2" onclick="window.craftSword()">鉄3+星晶石1</button></div>`}
 if(menuTab==='save')body=`<div class="row"><button class="menuBtn2" onclick="saveGame()">💾 セーブ</button><button class="menuBtn2" onclick="location.reload()">📂 再読込</button></div>`;
 if(menuTab==='settings')body=`<div class="row">カメラ感度 ${SETTINGS.camera.toFixed(1)} <button class="menuBtn2" onclick="window.cam(-.1)">−</button><button class="menuBtn2" onclick="window.cam(.1)">＋</button><br>効果音 ${AUDIO.enabled?'ON':'OFF'} <button class="menuBtn2" onclick="window.toggleAudio()">切替</button></div>`;
 gameMenu.innerHTML=`<h3>☰ GAME MENU</h3><div id="menuTabs">${tabs.map(([id,n])=>`<button class="menuTab" onclick="window.tab('${id}')">${n}</button>`).join('')}</div>${body}<button class="menuBtn2" onclick="document.getElementById('gameMenu').classList.remove('open')">閉じる</button>`;
}
window.tab=id=>{menuTab=id;renderMenu()};
window.equipW=id=>{weapon=id;state.atk=currentWeapon().atk;msg('⚔️ '+currentWeapon().name+'装備');renderMenu()};
window.useI=id=>{useItem(id);renderMenu()};
window.craftSword=()=>{const o=inventory.find(i=>i.id==='ore'),c=inventory.find(i=>i.id==='crystal');if(o.count<3||c.count<1)return msg('素材不足');o.count-=3;c.count--;state.atk+=8;msg('🔨 武器強化成功');renderMenu()};
window.cam=d=>{SETTINGS.camera=Math.max(.5,Math.min(1.8,SETTINGS.camera+d));renderMenu()};
window.toggleAudio=()=>{AUDIO.enabled=!AUDIO.enabled;renderMenu()};

function renderAI(){
 const q=AI.quests.find(q=>!q.done);
 aiPanel.innerHTML=`<h3>🤖 AI WORLD MASTER</h3>
 <div class="row">モード：${AI.mode}<br>職業：${AI.job}<br>状態：${AI.mood}<br>難易度：${AI.difficulty.toFixed(2)}<br>イベント：${AI.event}</div>
 <div class="row quest">AIクエスト：${q?`${q.name} ${(q.progress||0)}/${q.goal}`:'なし'}</div>
 <div class="row">ユニークスキル：${AI.skills.length?AI.skills.map(s=>`<span class="skill">${s.name}</span>`).join(' / '):'未獲得'}</div>
 <div class="row"><b>生成AIバックエンド</b><br><input id="backendInput" value="${AI.backendUrl}" placeholder="https://your-server.example/api/game-master"><br><button class="menuBtn2" id="saveBackend">保存</button><button class="menuBtn2" id="testBackend">接続テスト</button><br>状態：${AI.backendConnected?'接続済み':'未接続 → ローカルAI'}</div>
 ${AI.history.slice(0,8).map(x=>`<div class="row">${x}</div>`).join('')}`;
 document.getElementById('saveBackend').onclick=()=>{AI.backendUrl=document.getElementById('backendInput').value.trim();localStorage.setItem('yuusha_v22_backend',AI.backendUrl);renderAI()};
 document.getElementById('testBackend').onclick=()=>AI.backend('health').then(()=>renderAI());
}

let lastRegion='';
function updateZone(){
 const r=regionAt(player.position.x,player.position.z);if(r.name!==lastRegion){lastRegion=r.name;const z=document.getElementById('zone');z.textContent=r.name;z.style.display='block';setTimeout(()=>z.style.display='none',1700)}
}
let weather='clear',worldTime=480,weatherT=30;
const PERF={frames:0,last:performance.now(),fps:60,low:0,tick(){this.frames++;const now=performance.now();if(now-this.last>=1000){this.fps=Math.round(this.frames*1000/(now-this.last));this.frames=0;this.last=now;document.getElementById('perf').textContent='FPS '+this.fps;if(this.fps<36){this.low++;if(this.low>=3){renderer.setPixelRatio(1);sun.shadow.mapSize.set(512,512)}}else this.low=Math.max(0,this.low-1)}}};

const clock=new THREE.Clock();
let walkT=0;
function proceduralAnim(dt,moving){
 if(playerMixer){playAnim(moving?'walk':'idle');return}
 const p=playerVisual.userData.parts;if(!p)return;walkT+=dt*(moving?7:2);const s=Math.sin(walkT)*(moving?.55:.06);p.ll.rotation.x=s;p.rl.rotation.x=-s;p.la.rotation.x=-s*.7;p.ra.rotation.x=s*.7;
}
function updateEnemies(dt){
 let shown=null;
 for(const e of enemies){
  if(!e.alive)continue;e.cd=Math.max(0,e.cd-dt);e.wind=Math.max(0,e.wind-dt);
  const to=player.position.clone().sub(e.obj.position);to.y=0;const d=to.length();if(e.boss&&d<15)shown=e;
  if(d>1.7&&d<18){to.normalize();e.obj.position.addScaledVector(to,e.speed*AI.difficulty*dt);e.obj.rotation.y=Math.atan2(to.x,to.z)}
  if(d<2.4&&e.cd<=0){e.cd=e.boss?(e.phase===3?.9:1.3):1.8;e.wind=e.boss?.5:.7;telegraph.textContent='⚠️ '+e.name+' 攻撃予兆';telegraph.style.display='block';setTimeout(()=>telegraph.style.display='none',400);
   setTimeout(()=>{if(!e.alive)return;const dd=player.position.distanceTo(e.obj.position);if(dd<2.6){if(state.dodge>0){profile.parries++;msg('✨ ジャスト回避')}else{let dm=Math.floor(e.atk*AI.difficulty);if(state.guard)dm=Math.floor(dm*(AI.hasSkill('ironwall')?.35:.5));state.hp-=dm;profile.damageTaken+=dm;msg('💥 '+dm+'ダメージ');if(state.hp<=0){state.hp=state.maxHp;state.mp=state.maxMp;player.position.set(0,0,0);msg('💫 王都へ帰還')}}}},Math.floor(e.wind*1000))
  }
 }
 if(shown){bossBox.style.display='block';bossName.textContent=shown.name+(shown.phase===3?' FINAL':shown.phase===2?' PHASE 2':'');bossFill.style.width=(shown.hp/shown.maxHp*100)+'%'}else bossBox.style.display='none';
}

function updateHUD(){
 const hp=state.hp/state.maxHp*100,mp=state.mp/state.maxMp*100,st=state.st/state.maxSt*100,xp=state.xp/(state.lv*100)*100;
 document.getElementById('hud').innerHTML=`Lv.${state.lv}　💰${state.gold}G<br>❤️ <span class="bar"><span class="fill hp" style="width:${hp}%"></span></span> ${Math.ceil(state.hp)}<br>💧 <span class="bar"><span class="fill mp" style="width:${mp}%"></span></span><br>🟢 <span class="bar"><span class="fill st" style="width:${st}%"></span></span><br>⭐ <span class="bar"><span class="fill xp" style="width:${xp}%"></span></span><br>⚔️ ${currentWeapon().name}　⚡${Math.floor(state.burst)}%`;
 const q=AI.quests.find(q=>!q.done);objective.textContent=q?`目的：${q.name} ${(q.progress||0)}/${q.goal}`:mainBoss.alive?'目的：北のボスを倒す':'目的：世界を探索する';
 aiChip.textContent=`🤖 ${AI.job} / ${AI.mood} / ${AI.event}`;
}
function drawMini(){
 const w=mini.width=156,h=mini.height=156;mctx.clearRect(0,0,w,h);mctx.fillStyle='#101d29';mctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2,sc=1.7;
 mctx.fillStyle='#58aaff';mctx.beginPath();mctx.arc(cx,cy,5,0,7);mctx.fill();
 mctx.fillStyle='#ff5c61';for(const e of enemies){if(!e.alive)continue;const dx=(e.obj.position.x-player.position.x)*sc,dz=(e.obj.position.z-player.position.z)*sc;if(Math.abs(dx)<72&&Math.abs(dz)<72){mctx.beginPath();mctx.arc(cx+dx,cy+dz,e.boss?5:3,0,7);mctx.fill()}}
}

function loop(){
 const dt=Math.min(.033,clock.getDelta());PERF.tick();
 state.attackCd=Math.max(0,state.attackCd-dt);state.skillCd=Math.max(0,state.skillCd-dt);state.dodge=Math.max(0,state.dodge-dt);state.st=Math.min(state.maxSt,state.st+23*dt);state.mp=Math.min(state.maxMp,state.mp+3.5*dt);
 worldTime=(worldTime+dt*3)%1440;weatherT-=dt;if(weatherT<=0){weatherT=30+Math.random()*25;weather=['clear','clear','rain','fog'][Math.floor(Math.random()*4)]}
 const hour=worldTime/60,night=hour<6||hour>19;worldScene.background.set(night?0x10192c:weather==='rain'?0x6f8494:0x83bce4);worldScene.fog.near=weather==='fog'?18:38;worldScene.fog.far=weather==='fog'?65:110;sun.intensity=night?.3:2.1;

 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const mv=new THREE.Vector3().addScaledVector(right,joy.x).addScaledVector(forward,-joy.y);const moving=mv.lengthSq()>.01;
 if(moving){mv.normalize();const sp=state.dodge>0?(AI.hasSkill('afterimage')?11:8.5):5;player.position.addScaledVector(mv,sp*dt);player.rotation.y=Math.atan2(mv.x,mv.z)}
 proceduralAnim(dt,moving);for(const m of mixers)m.update(dt);updateEnemies(dt);updateZone();

 AI.last+=dt;if(AI.last>5){AI.last=0;AI.analyze();renderAI()}
 const h=Math.cos(pitch)*camDist,cy=Math.sin(pitch)*camDist+1.2,desired=player.position.clone().add(new THREE.Vector3(Math.sin(yaw)*h,cy,Math.cos(yaw)*h));camera.position.lerp(desired,.14);camera.lookAt(player.position.x,player.position.y+1.35,player.position.z);
 updateHUD();drawMini();selfHeal('Renderer',()=>renderer.render(worldScene,camera));requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});
setTimeout(()=>{boot.style.display='none';setSys('SELF HEAL','ok');renderMenu();renderAI()},650);
loop();
</script>
