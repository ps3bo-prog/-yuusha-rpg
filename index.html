<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="勇者の冒険">
<link rel="manifest" href="./manifest.webmanifest">
<title>勇者の冒険 診断版</title>
<style>
html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px}
h1{font-size:24px;margin:8px 0}
#status{margin:8px 0;padding:10px 14px;background:#222;border-radius:10px}
#game{width:min(94vw,700px);aspect-ratio:16/9;background:linear-gradient(#7ec8ff 0 35%,#4d8b3b 35% 100%);border:3px solid #fff;border-radius:12px;position:relative;overflow:hidden}
.hero{position:absolute;left:18%;top:55%;font-size:50px}
.castle{position:absolute;right:10%;top:35%;font-size:70px}
.tree1,.tree2,.tree3{position:absolute;font-size:42px;top:49%}.tree1{left:42%}.tree2{left:52%}.tree3{left:62%}
#msg{margin-top:12px;background:#1e1e1e;padding:12px;border-radius:10px;max-width:700px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(94vw,700px);margin-top:12px}
button{font-size:18px;padding:14px;border:0;border-radius:12px;background:#333;color:#fff}
button:active{background:#555}
</style>
</head>
<body>
<h1>⚔️ 勇者の冒険</h1>
<div id="status">❤️ HP 100/100　💧 MP 30/30　💰 100G</div>
<div id="game">
  <div class="hero" id="hero">🧑‍⚔️</div>
  <div class="castle">🏰</div>
  <div class="tree1">🌲</div><div class="tree2">🌲</div><div class="tree3">🌲</div>
</div>
<div id="msg">この画面が見えていればHTML表示は成功しています。下のボタンを押すと勇者が動きます。</div>
<div class="controls">
<button onclick="move(-10)">◀</button>
<button onclick="move(10)">▶</button>
<button onclick="attack()">⚔️ 攻撃</button>
<button onclick="skill()">🔥 スキル</button>
</div>
<script>
let x=18,hp=100,mp=30,gold=100;
function move(dx){
  x=Math.max(0,Math.min(85,x+dx));
  document.getElementById('hero').style.left=x+'%';
  document.getElementById('msg').textContent='勇者が移動しました。現在位置 '+x;
}
function attack(){
  document.getElementById('msg').textContent='⚔️ 勇者の攻撃！ スライムに18ダメージ！';
}
function skill(){
  if(mp<5){document.getElementById('msg').textContent='MPが足りません';return}
  mp-=5;
  document.getElementById('status').textContent=`❤️ HP ${hp}/100　💧 MP ${mp}/30　💰 ${gold}G`;
  document.getElementById('msg').textContent='🔥 ファイア！ 32ダメージ！';
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
