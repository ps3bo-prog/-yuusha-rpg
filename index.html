<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>勇者の冒険 REAL v9 VISUAL 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:rgba(7,11,16,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);border-radius:14px;box-shadow:0 8px 24px #0008}
#stats{padding:8px 10px;min-width:235px;font-size:12px;line-height:1.5}
.bar{width:140px;height:8px;background:#ffffff18;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.fill{height:100%;border-radius:99px}.hp{background:linear-gradient(90deg,#ff3e55,#ff8a59)}.mp{background:linear-gradient(90deg,#3b85ff,#63d7ff)}.st{background:linear-gradient(90deg,#6fd66f,#b7f089)}
#mini{width:110px;height:110px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:#0b1118}
#boss{display:none;position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:12;width:min(88vw,640px);padding:9px 12px;text-align:center;background:rgba(35,5,10,.86);border:1px solid #ff586655;border-radius:13px}
#boss .bar{width:82%;height:10px}
#log{position:fixed;left:50%;transform:translateX(-50%);bottom:126px;z-index:11;width:min(92vw,700px);padding:8px 12px;text-align:center;font-size:13px;background:rgba(7,11,16,.75);border:1px solid rgba(255,255,255,.12);border-radius:13px}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none}
#stick{width:138px;height:138px;border-radius:50%;background:#ffffff10;border:1px solid #ffffff22;position:relative;pointer-events:auto;box-shadow:inset 0 0 35px #0008}
#knob{position:absolute;width:64px;height:64px;border-radius:50%;left:37px;top:37px;background:linear-gradient(#ffffff3b,#ffffff15);border:1px solid #ffffff55}
#actions{display:grid;grid-template-columns:repeat(3,60px);gap:8px;pointer-events:auto}
.action{width:60px;height:60px;border-radius:50%;border:1px solid #ffffff44;background:linear-gradient(#2b3948df,#121a23f0);color:#fff;font-size:10px;font-weight:700;box-shadow:0 8px 18px #0009}
.action b{display:block;font-size:22px}.action:active{transform:scale(.94)}
#menu{position:fixed;right:10px;top:135px;z-index:21;display:flex;gap:6px}
.small{pointer-events:auto;border:1px solid rgba(255,255,255,.14);background:rgba(7,11,16,.82);color:#fff;border-radius:10px;padding:7px 9px}
#titleCard{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.58);padding:16px 22px;border-radius:16px;border:1px solid #ffffff22;text-align:center;animation:fade 4s forwards;pointer-events:none}
#titleCard h1{margin:0 0 6px;font-size:24px}
@keyframes fade{0%,65%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(max-width:700px){
 #stats{min-width:190px}.bar{width:105px}#mini{width:86px;height:86px}
 #stick{width:122px;height:122px}#knob{width:56px;height:56px;left:33px;top:33px}
 #actions{grid-template-columns:repeat(3,54px)}.action{width:54px;height:54px}
 #log{bottom:114px}
}

#worldFeed{position:fixed;left:10px;bottom:200px;z-index:15;width:min(330px,70vw);font-size:11px;pointer-events:none}
.feed{margin-top:4px;padding:6px 8px;background:rgba(6,10,15,.72);border-left:3px solid #8fc7ff;border-radius:6px}
#uniqueNotice{display:none;position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:35;
background:linear-gradient(135deg,rgba(20,8,35,.96),rgba(50,12,25,.96));border:1px solid #d78cff;
padding:18px 22px;border-radius:16px;text-align:center;box-shadow:0 0 30px #7d45ff77;min-width:min(80vw,420px)}
#uniqueNotice strong{display:block;font-size:22px;margin-bottom:6px}
#titleBadge{position:fixed;left:10px;top:175px;z-index:14;padding:6px 9px;font-size:11px;background:rgba(7,11,16,.8);
border:1px solid rgba(255,255,255,.12);border-radius:10px}
@media(max-width:700px){#worldFeed{bottom:180px;width:60vw}#titleBadge{top:135px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="titleCard"><h1>⚔️ 勇者の冒険 REAL v9 VISUAL 3D</h1><div>リアル寄りライティング・地形・水・草・剣エフェクト・ボス演出 強化版</div></div>

<div id="hud">
  <div id="stats" class="panel"></div>
  <canvas id="mini" width="110" height="110"></canvas>
</div>

<div id="boss">
  <div id="bossName"></div>
  <div class="bar"><div id="bossBar" class="fill hp"></div></div>
</div>

<div id="menu">
  <button class="small" onclick="saveGame()">💾</button>
  <button class="small" onclick="loadGame()">📂</button>
</div>

<div id="log">左スティックで移動。画面ドラッグで視点操作。敵の攻撃予兆に合わせて防御するとパリィ！</div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button class="action" id="attack"><b>⚔️</b>攻撃</button>
    <button class="action" id="skill"><b>🔥</b>スキル</button>
    <button class="action" id="dodge"><b>💨</b>回避</button>
    <button class="action" id="guard"><b>🛡️</b>防御</button>
    <button class="action" id="heal"><b>✨</b>回復</button>
    <button class="action" id="burst"><b>⚡</b>必殺</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.physicallyCorrectLights=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ec8f0);
scene.fog=new THREE.FogExp2(0xa8c7d6,0.0018);

const skyGeo=new THREE.SphereGeometry(500,32,16);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{
    top:{value:new THREE.Color(0x4f83bd)},
    bottom:{value:new THREE.Color(0xd7ecf7)},
    offset:{value:35},
    exponent:{value:.75}
  },
  vertexShader:`varying vec3 vWorldPosition;
    void main(){vec4 wp=modelMatrix*vec4(position,1.0);vWorldPosition=wp.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform vec3 top;uniform vec3 bottom;uniform float offset;uniform float exponent;varying vec3 vWorldPosition;
    void main(){float h=normalize(vWorldPosition+offset).y;float f=max(pow(max(h,0.0),exponent),0.0);gl_FragColor=vec4(mix(bottom,top,f),1.0);}`
});
const sky=new THREE.Mesh(skyGeo,skyMat);scene.add(sky);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.set(0,5,9);

const hemi=new THREE.HemisphereLight(0xddeeff,0x2a3a22,1.15);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3d6,3.4);
sun.position.set(30,50,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;
scene.add(sun);

const world=new THREE.Group();
scene.add(world);

function mat(color,rough=.8,metal=.04){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260,90,90),mat(0x4f7444,.92,.01));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
world.add(ground);

// subtle terrain bumps
const pos=ground.geometry.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), y=pos.getY(i);
  const z=Math.sin(x*.055)*.34+Math.cos(y*.08)*.28+Math.sin((x+y)*.035)*.20+Math.sin((x-y)*.018)*.12;
  pos.setZ(i,z);
}
ground.geometry.computeVertexNormals();

function addTree(x,z,s=1){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.6,8),mat(0x6b4a2d));
  trunk.position.y=.8; trunk.castShadow=true;
  const crown=new THREE.Mesh(new THREE.ConeGeometry(.9,2.4,10),mat(0x245c2a));
  crown.position.y=2.2; crown.castShadow=true;
  g.add(trunk,crown); g.position.set(x,0,z); g.scale.setScalar(s); world.add(g);
}
for(let i=0;i<110;i++){
  const a=Math.random()*Math.PI*2,r=30+Math.random()*85;
  addTree(Math.cos(a)*r,Math.sin(a)*r,.7+Math.random()*.8);
}

function addRock(x,z,s=1){
  const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.7,0),mat(0x666a70));
  r.scale.set(1,.7,1.2);r.position.set(x,.45,z);r.scale.multiplyScalar(s);r.castShadow=true;world.add(r);
}
for(let i=0;i<35;i++) addRock((Math.random()-.5)*170,(Math.random()-.5)*170,.6+Math.random()*1.4);

function addRuins(){
  const group=new THREE.Group();
  for(let i=0;i<8;i++){
    const c=new THREE.Mesh(new THREE.BoxGeometry(1.5,4,1.5),mat(0x8c8172));
    c.position.set((i%4)*3-4.5,2,Math.floor(i/4)*7-3.5);c.castShadow=true;c.receiveShadow=true;group.add(c);
  }
  group.position.set(34,0,-18);world.add(group);
}
addRuins();

function addCastle(){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(8,5,8),mat(0x4c4d55));base.position.y=2.5;base.castShadow=true;g.add(base);
  for(const [x,z] of [[-4,-4],[4,-4],[-4,4],[4,4]]){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.6,7,10),mat(0x41434a));t.position.set(x,3.5,z);t.castShadow=true;g.add(t);
  }
  g.position.set(-48,0,-42);world.add(g);
}
addCastle();



// ===== REAL v9 visual realism expansion =====
const grassMat=new THREE.MeshStandardMaterial({color:0x3f6d36,roughness:1,metalness:0,side:THREE.DoubleSide});
const grassGeo=new THREE.PlaneGeometry(.16,.8);
for(let i=0;i<900;i++){
  const blade=new THREE.Mesh(grassGeo,grassMat);
  const a=Math.random()*Math.PI*2,r=8+Math.random()*108;
  blade.position.set(Math.cos(a)*r,.38,Math.sin(a)*r);
  blade.rotation.y=Math.random()*Math.PI;
  blade.rotation.x=-Math.PI/2+.12*(Math.random()-.5);
  blade.scale.setScalar(.7+Math.random()*.8);
  blade.castShadow=false;
  world.add(blade);
}

const waterGeo=new THREE.CircleGeometry(16,64);
const waterMat=new THREE.MeshPhysicalMaterial({
  color:0x4c89b3,roughness:.18,metalness:.05,transparent:true,opacity:.82,
  transmission:.08,clearcoat:.5,clearcoatRoughness:.18
});
const water=new THREE.Mesh(waterGeo,waterMat);
water.rotation.x=-Math.PI/2;
water.position.set(24,.12,34);
water.receiveShadow=true;
world.add(water);

const mistGeo=new THREE.BufferGeometry();
const mistCount=180;
const mistPos=new Float32Array(mistCount*3);
for(let i=0;i<mistCount;i++){
  mistPos[i*3]=(Math.random()-.5)*160;
  mistPos[i*3+1]=.6+Math.random()*4;
  mistPos[i*3+2]=(Math.random()-.5)*160;
}
mistGeo.setAttribute('position',new THREE.BufferAttribute(mistPos,3));
const mistMat=new THREE.PointsMaterial({color:0xddeeff,size:.22,transparent:true,opacity:.18,depthWrite:false});
const mist=new THREE.Points(mistGeo,mistMat);
scene.add(mist);

function addDetailedRock(x,z,s=1){
  const geo=new THREE.IcosahedronGeometry(.75,1);
  const rock=new THREE.Mesh(geo,mat(0x62656a,.95,.02));
  rock.position.set(x,.55,z);
  rock.scale.set(1.25*s,.75*s,1.05*s);
  rock.rotation.set(Math.random()*.4,Math.random()*Math.PI,Math.random()*.3);
  rock.castShadow=true;rock.receiveShadow=true;world.add(rock);
}
for(let i=0;i<55;i++) addDetailedRock((Math.random()-.5)*190,(Math.random()-.5)*190,.55+Math.random()*1.25);

// ===== REAL v7 visual/world expansion =====
let worldTime=8*60, weather='clear', weatherTimer=25;

function addTown(x,z){
  const g=new THREE.Group();
  for(let i=0;i<7;i++){
    const house=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.7,2.2),mat(0xb68a5a));
    body.position.y=.85; body.castShadow=true; body.receiveShadow=true;
    const roof=new THREE.Mesh(new THREE.ConeGeometry(1.8,1.2,4),mat(0x7d2f2f));
    roof.position.y=2.25; roof.rotation.y=Math.PI/4; roof.castShadow=true;
    house.add(body,roof);
    house.position.set((i%4)*3.2-4.8,0,Math.floor(i/4)*4-2);
    g.add(house);
  }
  g.position.set(x,0,z);world.add(g);
}
addTown(18,18);

function addDungeonGate(x,z){
  const g=new THREE.Group();
  const stone=mat(0x575b62);
  const l=new THREE.Mesh(new THREE.BoxGeometry(1.3,4,1.3),stone);
  const r=l.clone(); const top=new THREE.Mesh(new THREE.BoxGeometry(5,1.1,1.3),stone);
  l.position.set(-2,2,0);r.position.set(2,2,0);top.position.set(0,4,0);
  l.castShadow=r.castShadow=top.castShadow=true;g.add(l,r,top);g.position.set(x,0,z);world.add(g);
}
addDungeonGate(-28,30);

function addLamp(x,z){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,2.6,8),mat(0x333333));
  pole.position.set(x,1.3,z);pole.castShadow=true;world.add(pole);
  const glow=new THREE.PointLight(0xffd88a,1.4,7,2);
  glow.position.set(x,2.7,z);scene.add(glow);
}
for(let i=0;i<8;i++) addLamp(10+i*2.5,16+(i%2)*2);

function makeHumanoid(color=0x3f79d6, scale=1){
  const g=new THREE.Group();
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.74,1.20,.42),mat(color,.5,.02));
  torso.position.y=1.55;torso.castShadow=true;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,20,16),mat(0xe2b48d,.68,.01));
  head.position.y=2.45;head.castShadow=true;
  const legGeo=new THREE.BoxGeometry(.25,.9,.28);
  const armGeo=new THREE.BoxGeometry(.22,.9,.24);
  const lLeg=new THREE.Mesh(legGeo,mat(0x26384f)); lLeg.position.set(-.22,.6,0);
  const rLeg=lLeg.clone(); rLeg.position.x=.22;
  const lArm=new THREE.Mesh(armGeo,mat(color,.5)); lArm.position.set(-.55,1.55,0);
  const rArm=lArm.clone(); rArm.position.x=.55;
  [lLeg,rLeg,lArm,rArm].forEach(m=>m.castShadow=true);
  g.add(torso,head,lLeg,rLeg,lArm,rArm);
  g.userData={torso,head,lLeg,rLeg,lArm,rArm,walk:0};
  g.scale.setScalar(scale);
  return g;
}

function animateHumanoid(g,speed,dt){
  if(!g.userData?.lLeg)return;
  g.userData.walk += dt*speed*6;
  const s=Math.sin(g.userData.walk)*.55;
  g.userData.lLeg.rotation.x=s;
  g.userData.rLeg.rotation.x=-s;
  g.userData.lArm.rotation.x=-s*.7;
  g.userData.rArm.rotation.x=s*.7;
}

const player=makeHumanoid(0x3f79d6,1.05);
const swordPivot=new THREE.Group();
const sword=new THREE.Mesh(
  new THREE.BoxGeometry(.10,1.95,.08),
  new THREE.MeshStandardMaterial({color:0xf2f6fb,metalness:1,roughness:.12})
);
const guardMesh=new THREE.Mesh(new THREE.BoxGeometry(.7,.08,.12),new THREE.MeshStandardMaterial({color:0xb7893e,metalness:.8,roughness:.22}));
guardMesh.position.set(0,-.1,0);sword.add(guardMesh);
sword.position.set(0,-.9,0);sword.castShadow=true;
swordPivot.position.set(.72,1.8,.05);swordPivot.rotation.z=-.55;swordPivot.add(sword);
player.add(swordPivot);scene.add(player);
player.position.set(0,0,0);

const state={
  hp:180,maxHp:180,mp:70,maxMp:70,st:100,maxSt:100,
  lv:1,xp:0,gold:200,atk:35,burst:0,speed:5.8,
  attackCD:0,skillCD:0,dodgeCD:0,guard:false,invincible:0,
  parryWindow:0,parries:0,perfectDodges:0,uniqueKills:0,title:'駆け出しの冒険者'
};

const enemies=[];
const bossSeen=new Set();
function createEnemy(type,x,z,boss=false){
  const data={
    slime:{color:0x67d65a,hp:70,atk:10,speed:2.2,size:.75,name:'スライム'},
    wolf:{color:0x4a4f5a,hp:120,atk:16,speed:3.7,size:.85,name:'ダークウルフ'},
    orc:{color:0x7b4f35,hp:180,atk:22,speed:2.5,size:1.05,name:'オーク'},
    boss1:{color:0xff5b35,hp:950,atk:32,speed:2.8,size:1.8,name:'炎獄騎士ヴァルガ'},
    boss2:{color:0x66aaff,hp:1400,atk:38,speed:3.3,size:2.1,name:'氷帝フェンリル'},
    boss3:{color:0x7d46c8,hp:2400,atk:48,speed:3.0,size:2.6,name:'深淵王アビス'}
  }[type];
  const g=new THREE.Group();
  let mesh;
  if(type==='wolf'||type==='boss2'){
    mesh=new THREE.Mesh(new THREE.BoxGeometry(data.size*1.8,data.size*.9,data.size*2.4),mat(data.color,.55));
    mesh.position.y=data.size*.8;
    const head=new THREE.Mesh(new THREE.BoxGeometry(data.size*1.0,data.size*.8,data.size*1.0),mat(data.color,.5));
    head.position.set(0,data.size*1.15,-data.size*1.45);g.add(head);
  }else if(type==='orc'||type==='boss1'){
    mesh=new THREE.Mesh(new THREE.CapsuleGeometry(data.size*.7,data.size*.9,6,10),mat(data.color,.6));
    mesh.position.y=data.size*1.25;
    const hornMat=mat(0xd8d2bd);
    for(const sx of [-1,1]){
      const h=new THREE.Mesh(new THREE.ConeGeometry(data.size*.16,data.size*.7,8),hornMat);
      h.position.set(sx*data.size*.6,data.size*2.0,0);h.rotation.z=sx*.45;g.add(h);
    }
  }else if(type==='boss3'){
    mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(data.size,2),mat(data.color,.4));
    mesh.position.y=data.size;
    for(let i=0;i<6;i++){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(.18*data.size,.9*data.size,7),mat(0x2d193f));
      const a=i/6*Math.PI*2;spike.position.set(Math.cos(a)*data.size*.75,data.size*1.4,Math.sin(a)*data.size*.75);spike.rotation.z=a;g.add(spike);
    }
  }else{
    mesh=new THREE.Mesh(new THREE.SphereGeometry(data.size,20,14),mat(data.color,.55));
    mesh.position.y=data.size;
  }
  mesh.castShadow=true;
  const eyeMat=new THREE.MeshBasicMaterial({color:0xffeeee});
  const eye1=new THREE.Mesh(new THREE.SphereGeometry(.12*data.size,8,8),eyeMat);
  eye1.position.set(-.22*data.size,1.05*data.size,-.72*data.size);
  const eye2=eye1.clone();eye2.position.x*=-1;
  g.add(mesh,eye1,eye2);g.position.set(x,0,z);scene.add(g);
  const e={...data,type,boss,obj:g,hp:data.hp,maxHp:data.hp,alive:true,nextAttack:0,windup:0,phase:1,flash:0};
  enemies.push(e);return e;
}
for(let i=0;i<28;i++){
  const a=Math.random()*Math.PI*2,r=18+Math.random()*75;
  createEnemy(i%6===0?'orc':i%2?'wolf':'slime',Math.cos(a)*r,Math.sin(a)*r,false);
}
createEnemy('boss1',34,-18,true);
createEnemy('boss2',58,45,true);
createEnemy('boss3',-48,-42,true);

// Unique monsters: spawned/activated only under special conditions.
const uniqueShade=createEnemy('boss3',88,-78,true);
uniqueShade.name='月蝕の獣ネブラ';uniqueShade.hp=1800;uniqueShade.maxHp=1800;uniqueShade.atk=42;uniqueShade.obj.visible=false;uniqueShade.alive=false;uniqueShade.unique=true;

const uniqueKnight=createEnemy('boss1',-92,72,true);
uniqueKnight.name='無傷の騎士レグルス';uniqueKnight.hp=1500;uniqueKnight.maxHp=1500;uniqueKnight.atk=40;uniqueKnight.obj.visible=false;uniqueKnight.alive=false;uniqueKnight.unique=true;

const allies=[];
function addAlly(name,color,offset,role){
  const g=makeHumanoid(color,.82);scene.add(g);
  const a={name,role,obj:g,offset,hp:120,maxHp:120,cd:0,atk:role==='mage'?30:role==='tank'?24:16};allies.push(a);
}
addAlly('レオン',0x6f8fd6,new THREE.Vector3(-1.6,0,1.6),'tank');
addAlly('ミラ',0xc26ad6,new THREE.Vector3(1.6,0,1.8),'mage');
addAlly('セラ',0x7bdba7,new THREE.Vector3(0,0,2.8),'healer');

let joy={x:0,y:0};
let targetYaw=0,currentYaw=0,targetPitch=0.45,currentPitch=0.45;
const clock=new THREE.Clock();
const logEl=document.getElementById('log');
const bossEl=document.getElementById('boss'),bossName=document.getElementById('bossName'),bossBar=document.getElementById('bossBar');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');

function msg(t){logEl.textContent=t}
const feedEl=document.getElementById('worldFeed');
const uniqueNotice=document.getElementById('uniqueNotice');
const titleBadge=document.getElementById('titleBadge');
let worldFeedCount=0, nightSteps=0, noDamageKills=0, discoveredUnique=false;

function feed(t){
  const d=document.createElement('div');
  d.className='feed';d.textContent=t;feedEl.prepend(d);
  worldFeedCount++;
  while(feedEl.children.length>5)feedEl.lastChild.remove();
}
function uniquePop(title,sub=''){
  uniqueNotice.innerHTML=`<strong>${title}</strong><div>${sub}</div>`;
  uniqueNotice.style.display='block';
  setTimeout(()=>uniqueNotice.style.display='none',2600);
}
function setTitle(t){
  state.title=t;titleBadge.textContent='称号：'+t;feed('🏷️ 新称号「'+t+'」を獲得');
}

function distXZ(a,b){const dx=a.x-b.x,dz=a.z-b.z;return Math.hypot(dx,dz)}
function nearest(range=3.2){
  let best=null,d=999;
  for(const e of enemies){if(!e.alive)continue;const dd=distXZ(player.position,e.obj.position);if(dd<range&&dd<d){d=dd;best=e}}
  return best;
}
function damageEnemy(e,dmg){
  e.hp-=dmg;e.flash=.12;
  if(e.hp<=0){
    e.hp=0;e.alive=false;e.obj.visible=false;
    state.gold+=e.boss?500:20;state.xp+=e.boss?200:25;
    if(e.unique){
      state.uniqueKills++;uniquePop('UNIQUE MONSTER DEFEATED',e.name);
      feed(`🌐 ワールドログ：${e.name} が討伐された`);
      if(state.uniqueKills===1)setTitle('ユニークハンター');
    }else{
      msg(`🏆 ${e.name} 撃破！`);
    }
    if(state.hp===state.maxHp)noDamageKills++;
    if(state.xp>=state.lv*100){
      state.xp-=state.lv*100;state.lv++;state.maxHp+=24;state.hp=state.maxHp;state.atk+=5;msg(`⬆️ Lv.${state.lv}！`);
    }
  }
}
let slashFX=null;
function makeSlashFX(){
  if(slashFX){scene.remove(slashFX);slashFX=null}
  const geo=new THREE.TorusGeometry(1.25,.05,8,64,Math.PI*1.15);
  const matFX=new THREE.MeshBasicMaterial({color:0xbfe8ff,transparent:true,opacity:.85,side:THREE.DoubleSide});
  slashFX=new THREE.Mesh(geo,matFX);
  slashFX.position.copy(player.position);slashFX.position.y=1.35;
  slashFX.rotation.set(Math.PI/2,0,player.rotation.y+.6);
  scene.add(slashFX);
  setTimeout(()=>{if(slashFX){scene.remove(slashFX);slashFX=null}},180);
}

function attack(){
  if(state.attackCD>0||state.st<8)return;
  state.attackCD=.36;state.st-=8;
  const e=nearest(3.4);
  swordPivot.rotation.x=-1.5;swordPivot.rotation.z=-1.15;
  makeSlashFX();
  setTimeout(()=>{swordPivot.rotation.x=0;swordPivot.rotation.z=-.55},160);
  if(!e){msg('⚔️ 空振り');return}
  const dmg=Math.floor(state.atk+state.lv*4+Math.random()*10);
  damageEnemy(e,dmg);state.burst=Math.min(100,state.burst+10);msg(`⚔️ ${e.name}に ${dmg}ダメージ`);
}
function skill(){
  if(state.skillCD>0||state.mp<15)return;
  state.skillCD=1.8;state.mp-=15;
  let hit=0;
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.5,4.2,48),new THREE.MeshBasicMaterial({color:0xff7a35,transparent:true,opacity:.65,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.copy(player.position);ring.position.y=.08;scene.add(ring);
  setTimeout(()=>scene.remove(ring),350);
  for(const e of enemies){if(e.alive&&distXZ(player.position,e.obj.position)<4.4){damageEnemy(e,60+state.lv*8);hit++}}
  msg(`🔥 範囲スキル！ ${hit}体命中`);
}
function dodge(){
  if(state.st<22)return;
  state.st-=22;state.invincible=.55;state.dodgeCD=.5;
  const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
  const dash=forward.multiplyScalar(3.5);
  player.position.add(dash);
  player.position.x=THREE.MathUtils.clamp(player.position.x,-118,118);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-118,118);
  msg('💨 回避！');
}
function guard(){
  state.guard=true;
  state.parryWindow=.22;
  msg('🛡️ ガード！ 攻撃直前ならパリィ');
  setTimeout(()=>{state.guard=false},450);
}
function heal(){if(state.mp<12||state.hp>=state.maxHp)return;state.mp-=12;state.hp=Math.min(state.maxHp,state.hp+55+state.lv*6);msg('✨ 回復！')}
function burst(){
  if(state.burst<100)return;state.burst=0;
  let hit=0;for(const e of enemies){if(e.alive&&distXZ(player.position,e.obj.position)<7){damageEnemy(e,190+state.lv*20);hit++}}
  msg(`⚡ 必殺技「天翔断」！ ${hit}体`);
}

function updateEnemies(dt){
  let shown=null;
  for(const e of enemies){
    if(!e.alive)continue;
    if(e.flash>0){e.flash-=dt;e.obj.scale.setScalar(1+e.flash*2)}else e.obj.scale.setScalar(1);
    const d=distXZ(player.position,e.obj.position);
    if(e.boss&&d<16)shown=e;
    if(e.boss&&e.hp<e.maxHp*.5&&e.phase===1){e.phase=2;e.speed*=1.3;e.atk+=8;msg(`💢 ${e.name} 第2形態！`)}
    if(d<16&&e.windup<=0){
      const dir=new THREE.Vector3().subVectors(player.position,e.obj.position);dir.y=0;
      if(dir.length()>1.5){dir.normalize();e.obj.position.addScaledVector(dir,e.speed*dt)}
      e.obj.lookAt(player.position.x,e.obj.position.y,player.position.z);
    }
    e.nextAttack-=dt;
    if(e.windup>0){
      e.windup-=dt;
      const pulse=1+Math.sin(performance.now()/45)*.08;
      e.obj.scale.setScalar(pulse);
      if(e.windup<=0&&d<(e.boss?3.8:2.2)){
        if(state.invincible>0){
          state.perfectDodges++;msg('✨ ジャスト回避！');state.burst=Math.min(100,state.burst+18);
          if(state.perfectDodges===10)setTitle('刹那の回避者');
        }else if(state.parryWindow>0){
          state.parries++;state.burst=Math.min(100,state.burst+25);
          e.windup=0;e.nextAttack=1.6;
          damageEnemy(e,35+state.lv*6);
          msg('⚡ PARRY！ カウンター成功');
          if(state.parries===10)setTitle('鉄壁の返し手');
        }else{
          let dmg=e.atk+Math.floor(Math.random()*8);
          if(state.guard)dmg=Math.floor(dmg*.45);
          state.hp-=dmg;msg(`💥 ${e.name} ${dmg}ダメージ`);
          if(state.hp<=0){state.hp=state.maxHp;state.mp=state.maxMp;player.position.set(0,0,0);msg('💫 力尽きた。王都へ帰還')}
        }
      }
    }else if(d<(e.boss?4.2:2.6)&&e.nextAttack<=0){
      e.nextAttack=e.boss?1.4:2.0;e.windup=e.boss?.8:.55;msg(`⚠️ ${e.name}の攻撃予兆！`);
    }
  }
  if(shown){
  bossEl.style.display='block';bossName.textContent=shown.name+(shown.phase===2?' PHASE 2':'');bossBar.style.width=(shown.hp/shown.maxHp*100)+'%';
  if(!bossSeen.has(shown.name)){
    bossSeen.add(shown.name);
    const oldExposure=renderer.toneMappingExposure;
    renderer.toneMappingExposure=.55;
    camera.position.y+=1.5;
    msg(`⚠️ BOSS ENCOUNTER：${shown.name}`);
    setTimeout(()=>renderer.toneMappingExposure=oldExposure,700);
  }
}else bossEl.style.display='none';
}

function updateAllies(dt){
  const target=nearest(12);
  for(const a of allies){
    a.cd-=dt;
    const desired=player.position.clone().add(a.offset);
    const d=a.obj.position.distanceTo(desired);
    if(d>.7)a.obj.position.lerp(desired,Math.min(1,dt*2.2));
    if(!target)continue;
    const td=a.obj.position.distanceTo(target.obj.position);
    if(a.role==='tank'&&td<3.3&&a.cd<=0){damageEnemy(target,a.atk);a.cd=1.0}
    if(a.role==='mage'&&td<8&&a.cd<=0){damageEnemy(target,a.atk+18);a.cd=1.6}
    if(a.role==='healer'&&state.hp<state.maxHp*.55&&a.cd<=0){state.hp=Math.min(state.maxHp,state.hp+30);a.cd=2.4;msg('✨ セラが回復！')}
  }
}

const npc=makeHumanoid(0xa66a3f,.9);npc.position.set(18,0,18);scene.add(npc);
const questMarker=new THREE.Mesh(new THREE.ConeGeometry(.22,.55,8),new THREE.MeshBasicMaterial({color:0xffdd33}));
questMarker.position.set(18,3.2,18);questMarker.rotation.z=Math.PI;scene.add(questMarker);
let questDone=false;

const simulatedPlayers=[];
for(let i=0;i<9;i++){
  const g=makeHumanoid([0x55aaff,0xdd6699,0x77cc88,0xd6aa55][i%4],.78);
  g.position.set((Math.random()-.5)*65,0,(Math.random()-.5)*65);
  scene.add(g);
  simulatedPlayers.push({obj:g,name:['Raven','Mio','Kite','Noa','Zen','Luna','Ash','Rin','Gale'][i],a:Math.random()*6.28,speed:.5+Math.random()*.4});
}
function updateSimPlayers(dt){
  simulatedPlayers.forEach((s,i)=>{
    s.a+=dt*(.15+i*.01);
    const target=new THREE.Vector3(Math.cos(s.a+i)*28,0,Math.sin(s.a*.8+i)*28);
    const dir=target.clone().sub(s.obj.position);dir.y=0;
    if(dir.length()>.5){dir.normalize();s.obj.position.addScaledVector(dir,s.speed*dt*3);s.obj.lookAt(target.x,0,target.z);animateHumanoid(s.obj,1,dt)}
  });
}

function checkUniqueConditions(){
  const hour=worldTime/60;
  // Night travel unlocks one unique boss.
  if((hour<5||hour>21) && Math.hypot(player.position.x-88,player.position.z+78)<28 && !uniqueShade.alive && state.uniqueKills<3){
    uniqueShade.alive=true;uniqueShade.obj.visible=true;uniqueShade.hp=uniqueShade.maxHp;
    uniquePop('UNIQUE MONSTER APPEARED','月蝕の獣ネブラ');
    feed('🌐 ？？？：月蝕の獣が現れたとの噂');
  }
  // No-damage performance unlocks another unique boss.
  if(noDamageKills>=5 && Math.hypot(player.position.x+92,player.position.z-72)<28 && !uniqueKnight.alive && !discoveredUnique){
    uniqueKnight.alive=true;uniqueKnight.obj.visible=true;uniqueKnight.hp=uniqueKnight.maxHp;discoveredUnique=true;
    uniquePop('SECRET CONDITION CLEARED','無傷の騎士レグルス');
  }
}

function checkQuest(){
  const d=distXZ(player.position,npc.position);
  if(d<2.5&&!questDone) msg('📜 NPC：古代遺跡の魔物を倒してくれ。');
  if(!questDone && enemies.filter(e=>!e.alive&&!e.boss).length>=5){
    questDone=true;state.gold+=300;msg('✅ クエスト達成！ 300G獲得');
  }
}

function updateHUD(){
  const hp=state.hp/state.maxHp*100,mp=state.mp/state.maxMp*100,st=state.st/state.maxSt*100;
  document.getElementById('stats').innerHTML=
  `Lv.${state.lv}　💰${state.gold}G<br>`+
  `❤️ <span class="bar"><span class="fill hp" style="display:block;width:${hp}%"></span></span> ${Math.ceil(state.hp)}/${state.maxHp}<br>`+
  `💧 <span class="bar"><span class="fill mp" style="display:block;width:${mp}%"></span></span><br>`+
  `🟢 <span class="bar"><span class="fill st" style="display:block;width:${st}%"></span></span><br>`+
  `⚡ 必殺 ${Math.floor(state.burst)}%　⚔️P:${state.parries}　💨J:${state.perfectDodges}<br>🏷️ ${state.title}`;
}
function drawMini(){
  mctx.clearRect(0,0,110,110);mctx.fillStyle='#13212b';mctx.fillRect(0,0,110,110);
  const map=(v)=>55+v*.45;
  for(const e of enemies){if(e.alive&&e.boss){mctx.fillStyle='#ff4d5d';mctx.beginPath();mctx.arc(map(e.obj.position.x),map(e.obj.position.z),3,0,7);mctx.fill()}}
  mctx.fillStyle='#4aa3ff';mctx.beginPath();mctx.arc(map(player.position.x),map(player.position.z),4,0,7);mctx.fill();
}

function updateCamera(){
  currentYaw+=(targetYaw-currentYaw)*.12;
  currentPitch+=(targetPitch-currentPitch)*.12;

  const distance=8.8;
  const horizontal=Math.cos(currentPitch)*distance;
  const height=Math.sin(currentPitch)*distance + 1.8;

  const offset=new THREE.Vector3(
    Math.sin(currentYaw)*horizontal,
    height,
    Math.cos(currentYaw)*horizontal
  );

  const desired=player.position.clone().add(offset);
  camera.position.lerp(desired,.16);
  camera.lookAt(player.position.x,player.position.y+1.25,player.position.z);
}
function animate(){
  const dt=Math.min(.033,clock.getDelta());
  state.attackCD=Math.max(0,state.attackCD-dt);
  state.skillCD=Math.max(0,state.skillCD-dt);
  state.invincible=Math.max(0,state.invincible-dt);
  state.parryWindow=Math.max(0,state.parryWindow-dt);
  state.st=Math.min(state.maxSt,state.st+24*dt);
  state.mp=Math.min(state.maxMp,state.mp+2.3*dt);

  const len=Math.hypot(joy.x,joy.y);
  if(len>.05){
    // Camera-relative movement: up on the stick always moves away from the camera.
    const camForward=new THREE.Vector3();
    camera.getWorldDirection(camForward);
    camForward.y=0;
    camForward.normalize();
    const camRight=new THREE.Vector3(camForward.z,0,-camForward.x);

    const dir=camForward.multiplyScalar(-joy.y).add(camRight.multiplyScalar(-joy.x));
    if(dir.lengthSq()>0.0001){
      dir.normalize();
      const moveSpeed=state.speed*(state.invincible>0?1.35:1);
      player.position.addScaledVector(dir,moveSpeed*dt);
      // Player faces movement direction, but camera remains independently controllable.
      const faceYaw=Math.atan2(dir.x,dir.z)+Math.PI;
      player.rotation.y=faceYaw;
    }
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x,-118,118);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-118,118);

  const moving=Math.hypot(joy.x,joy.y)>.05;
  animateHumanoid(player,moving?1:0,dt);
  for(const a of allies) animateHumanoid(a.obj,1,dt);

  worldTime=(worldTime+dt*3)%1440;
  water.rotation.z+=dt*.035;
  mist.rotation.y+=dt*.004;
  weatherTimer-=dt;
  if(weatherTimer<=0){weatherTimer=25+Math.random()*25;weather=['clear','clear','rain','fog'][Math.floor(Math.random()*4)]}
  const hour=worldTime/60;
  const daylight=Math.max(.18,Math.sin((hour-6)/24*Math.PI*2)*.55+.65);
  hemi.intensity=1.0+daylight*.8;
  sun.intensity=.6+daylight*1.7;
  const night=hour<6||hour>19;
  const dusk=(hour>=17&&hour<=19)||(hour>=5&&hour<7);
  skyMat.uniforms.top.value.set(night?0x0d1730:dusk?0xd77958:weather==='rain'?0x64788a:0x4f83bd);
  skyMat.uniforms.bottom.value.set(night?0x17243a:dusk?0xf0b889:0xd7ecf7);
  scene.fog.color.set(night?0x1c2940:weather==='fog'?0xc5d3da:0xa8c7d6);
  scene.fog.density=weather==='fog'?.0065:weather==='rain'?.0032:.0018;

  updateEnemies(dt);updateAllies(dt);updateSimPlayers(dt);checkQuest();checkUniqueConditions();updateCamera();updateHUD();drawMini();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const stick=document.getElementById('stick'),knob=document.getElementById('knob');let active=false;
function joySet(x,y){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=x-cx,dy=y-cy,max=r.width*.32,len=Math.hypot(dx,dy)||1,cl=Math.min(max,len);
  joy.x=dx/len*(cl/max);joy.y=dy/len*(cl/max);knob.style.transform=`translate(${joy.x*max}px,${joy.y*max}px)`;
}
stick.onpointerdown=e=>{active=true;stick.setPointerCapture(e.pointerId);joySet(e.clientX,e.clientY)};
stick.onpointermove=e=>{if(active)joySet(e.clientX,e.clientY)};
function endJoy(){active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
stick.onpointerup=endJoy;stick.onpointercancel=endJoy;

document.getElementById('attack').onpointerdown=attack;
document.getElementById('skill').onpointerdown=skill;
document.getElementById('dodge').onpointerdown=dodge;
document.getElementById('guard').onpointerdown=guard;
document.getElementById('heal').onpointerdown=heal;
document.getElementById('burst').onpointerdown=burst;


// ===== Touch free-look camera =====
// Left joystick = movement.
// Drag anywhere else on the game view = camera rotation.
let cameraPointerId=null;
let cameraDrag=false;
let lastCamX=0,lastCamY=0;

function isUIElement(target){
  return !!target.closest('#stick,#actions,#menu,#hud,#boss,#log,#titleCard');
}

document.addEventListener('pointerdown',e=>{
  if(isUIElement(e.target)) return;
  cameraPointerId=e.pointerId;
  cameraDrag=true;
  lastCamX=e.clientX;
  lastCamY=e.clientY;
},{passive:false});

document.addEventListener('pointermove',e=>{
  if(!cameraDrag || e.pointerId!==cameraPointerId) return;
  e.preventDefault();

  const dx=e.clientX-lastCamX;
  const dy=e.clientY-lastCamY;
  lastCamX=e.clientX;
  lastCamY=e.clientY;

  targetYaw -= dx*0.006;
  targetPitch += dy*0.0045;

  // Limit vertical camera angle so it cannot flip upside down.
  targetPitch=THREE.MathUtils.clamp(targetPitch,0.12,1.05);
},{passive:false});

function endCameraDrag(e){
  if(e.pointerId!==cameraPointerId) return;
  cameraDrag=false;
  cameraPointerId=null;
}

document.addEventListener('pointerup',endCameraDrag);
document.addEventListener('pointercancel',endCameraDrag);

// Double-tap / double-click on the world recenters the camera behind the player.
let lastWorldTap=0;
document.addEventListener('pointerup',e=>{
  if(isUIElement(e.target)) return;
  const now=performance.now();
  if(now-lastWorldTap<300){
    targetYaw=player.rotation.y-Math.PI;
    targetPitch=.45;
    msg('🎥 カメラを背後に戻しました');
  }
  lastWorldTap=now;
});


window.saveGame=()=>{
  localStorage.setItem('yuusha_v6_3d',JSON.stringify({
    state,
    pos:{x:player.position.x,y:player.position.y,z:player.position.z},
    enemies:enemies.map(e=>({hp:e.hp,alive:e.alive,phase:e.phase})),
    noDamageKills,discoveredUnique
  }));
  msg('💾 セーブしました');
};
window.loadGame=()=>{
  const s=localStorage.getItem('yuusha_v6_3d');if(!s)return msg('📂 セーブデータなし');
  const d=JSON.parse(s);Object.assign(state,d.state);player.position.set(d.pos.x,d.pos.y,d.pos.z);
  noDamageKills=d.noDamageKills||0;discoveredUnique=!!d.discoveredUnique;
  d.enemies?.forEach((v,i)=>{if(enemies[i]){enemies[i].hp=v.hp;enemies[i].alive=v.alive;enemies[i].phase=v.phase||1;enemies[i].obj.visible=v.alive}});
  setTitle(state.title||'駆け出しの冒険者');
  msg('📂 ロードしました');
};

setTimeout(()=>feed('🌐 ワールドログ：氷獄城周辺で強敵の目撃情報'),1200);
