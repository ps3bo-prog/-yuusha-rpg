function inventoryItem(id){return inventory.find(i=>i.id===id)}
function canCraft(r){return Object.entries(r.need).every(([k,v])=>(inventoryItem(k)?.count||0)>=v)}
function doCraft(id){
 const r=CRAFT.recipes.find(x=>x.id===id);if(!r||!canCraft(r))return msg('素材が足りない');
 for(const [k,v] of Object.entries(r.need))inventoryItem(k).count-=v;
 if(r.kind==='weapon'){weapons.push({id:r.id,name:r.name,atk:r.atk});weapon=r.id;state.atk=r.atk}
 if(r.kind==='armor'){equipment.armor={name:r.name,def:r.def,rarity:'epic'}}
 CODEX.items.add(r.name);msg('⚒️ '+r.name+' を作成');
 renderCraft();
}
function buyWeapon(i){
 const w=TOWN.shops.weapon[i];if(state.gold<w.price)return msg('Gが足りない');
 state.gold-=w.price;weapons.push({id:'shop_'+Date.now(),name:w.name,atk:w.atk});weapon=weapons[weapons.length-1].id;state.atk=w.atk;msg('⚔️ '+w.name+' を購入');renderTown();
}
function buyArmor(i){
 const a=TOWN.shops.armor[i];if(state.gold<a.price)return msg('Gが足りない');
 state.gold-=a.price;equipment.armor={name:a.name,def:a.def,rarity:'rare'};msg('🛡️ '+a.name+' を購入');renderTown();
}

}

 const swing=5+Math.floor(Math.random()*11);FACTION_WAR.score[a]+=swing;FACTION_WAR.score[b]-=swing;
 if(FACTION_WAR.score[a]>FACTION_WAR.score[b]+20){FACTION_WAR.territory[a]++;FACTION_WAR.territory[b]=Math.max(0,FACTION_WAR.territory[b]-1)}

}

const BIOMES=[
 {id:'plains',name:'緑風平原',ground:'#4f8c4a',path:'#8f7d56',tree:'#2b6934'},
 {id:'forest',name:'古代森林',ground:'#315f36',path:'#6e6642',tree:'#174b27'},
 {id:'snow',name:'白銀雪原',ground:'#c6dce0',path:'#aeb9bd',tree:'#6b8d86'},

];
function hash(x,y){let n=(x*374761393+y*668265263)>>>0;n=(n^(n>>13))*1274126177>>>0;return ((n^(n>>16))>>>0)/4294967295}
function biomeAt(x,y){const cx=Math.floor(x/900),cy=Math.floor(y/900),v=Math.abs((cx*17+cy*31)%BIOMES.length);return BIOMES[v]}
function heightNoise(x,y){return hash(Math.floor(x/160),Math.floor(y/160))}
const chunks=new Map();
function key(cx,cy){return cx+','+cy}
function ensureChunk(cx,cy){
 const k=key(cx,cy);if(chunks.has(k))return chunks.get(k);
 const items=[],npcs=[],chests=[];
 for(let i=0;i<28;i++){
  const x=(cx*CHUNK+hash(cx*99+i,cy*31+i)*CHUNK)*TILE;
  const y=(cy*CHUNK+hash(cy*71+i,cx*17+i)*CHUNK)*TILE;
  const r=hash(cx*11+i,cy*13-i);
  items.push({x,y,type:r<.55?'tree':r<.82?'rock':'flower'});
 }
 if(hash(cx,cy)>.76)chests.push({x:(cx*CHUNK+10)*TILE,y:(cy*CHUNK+10)*TILE,opened:false});
 if(hash(cx+7,cy-5)>.83)npcs.push({name:'旅人',x:(cx*CHUNK+8)*TILE,y:(cy*CHUNK+7)*TILE});
 const c={cx,cy,items,npcs,chests};chunks.set(k,c);return c;
}
function activeChunks(){const cx=Math.floor(player.x/(CHUNK*TILE)),cy=Math.floor(player.y/(CHUNK*TILE)),arr=[];for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)arr.push(ensureChunk(cx+dx,cy+dy));return arr}

const enemies=[];
const RESPAWN_TARGET=28;
function spawnEnemy(type='wolf',around=true){
 const defs={
  wolf:{name:'影狼',hp:110,atk:13,speed:58,color:'#58616b',size:18},
  orc:{name:'岩肌オーク',hp:190,atk:20,speed:44,color:'#8b4d35',size:22},
  mage:{name:'深森の魔術師',hp:140,atk:18,speed:48,color:'#6b3b8c',size:20},
  demon:{name:'下級悪魔',hp:230,atk:24,speed:52,color:'#7b2437',size:22}
 };
 const d=defs[type]||defs.wolf,ang=Math.random()*Math.PI*2,r=around?420+Math.random()*500:700;
 enemies.push({type,name:d.name,x:player.x+Math.cos(ang)*r,y:player.y+Math.sin(ang)*r,hp:d.hp,maxHp:d.hp,atk:d.atk,speed:d.speed,color:d.color,size:d.size,alive:true,cd:0,boss:false,mythic:false,respawnAt:0});
}
function maintainEnemies(){
 const alive=enemies.filter(e=>e.alive&&!e.mythic).length;
 for(let i=alive;i<RESPAWN_TARGET;i++){const r=Math.random();spawnEnemy(r<.55?'wolf':r<.78?'orc':r<.93?'mage':'demon')}
}
for(let i=0;i<RESPAWN_TARGET;i++)spawnEnemy(i%5===0?'orc':i%7===0?'mage':'wolf');

function unlockAchievement(id){

function weaponRange(){

function threatClass(e){
 if(e.mythic)return 'mythic';
 if(e.boss)return 'boss';
 if((e.maxHp||0)>=320)return 'unique';
 if((e.maxHp||0)>=200)return 'elite';

}

function drawCombatRange(camX,camY){

 ctx.save();
 const nearby=!!nearest(r.r+45);
 const pulse=Math.max(0,player.rangePulse||0);
 ctx.globalAlpha=nearby?(.16+pulse*.22):(.07+pulse*.18);
 ctx.fillStyle=weapon==='staff'?'#ffd34a':weapon==='spear'?'#5be7ff':'#76b7ff';

 if(r.type==='circle'){
   ctx.beginPath();ctx.arc(p.x,p.y,r.r,0,Math.PI*2);ctx.fill();ctx.stroke();
 }else{
   const len=r.r,w=r.w;
   ctx.fillRect(p.x-w/2,p.y-len,w,len);ctx.strokeRect(p.x-w/2,p.y-len,w,len);

const FLOATING=[];

}
function drawFloating(camX,camY,dt){
 for(let i=FLOATING.length-1;i>=0;i--){
   const f=FLOATING[i];f.life-=dt;f.y-=25*dt;
   const s=worldToScreen(f.x,f.y,camX,camY);
   ctx.globalAlpha=Math.max(0,f.life/f.max);
   ctx.font='bold 12px -apple-system,BlinkMacSystemFont,sans-serif';

 }
}

 AI.last+=dt;if(AI.last>5){AI.last=0;AI.analyze();evolveSkills();unlockCompanion();updateWorldFactions();renderAI()}
 if(COMPANION.active&&Math.floor(performance.now()/1800)!==Math.floor((performance.now()-dt*1000)/1800))companionAttack()
 worldTime=(worldTime+dt*4)%1440;weatherTimer-=dt;if(weatherTimer<=0){weatherTimer=30+Math.random()*30;weather=['clear','clear','rain','fog'][Math.floor(Math.random()*4)]}
 if(hasSkill('sun_core')&&worldTime/60>=6&&worldTime/60<=18)state.hp=Math.min(state.maxHp,state.hp+1.2*dt);
 const b=biomeAt(player.x,player.y);if(b.name!==lastBiome){lastBiome=b.name;CODEX.zones.add(b.name);zoneEl.textContent=b.name;zoneEl.style.display='block';setTimeout(()=>zoneEl.style.display='none',1500)}
}

const mini=document.getElementById('minimap'),mctx=mini.getContext('2d');
const worldMap=document.getElementById('worldMap'),wctx=worldMap.getContext('2d');
function mapDot(c,x,y,r=3){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function drawMap(c,w,h,range){
 c.clearRect(0,0,w,h);
 const b=biomeAt(player.x,player.y);c.fillStyle=b.ground;c.fillRect(0,0,w,h);
 c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1;
 for(let i=0;i<9;i++){let x=i*w/8;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();let y=i*h/8;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
 const conv=(x,y)=>({x:w/2+(x-player.x)/range*w/2,y:h/2+(y-player.y)/range*h/2});
 for(const ch of activeChunks()){
  for(const chest of ch.chests)if(!chest.opened){const p=conv(chest.x,chest.y);if(p.x>=0&&p.y>=0&&p.x<w&&p.y<h){c.fillStyle='#ffd166';c.fillRect(p.x-2,p.y-2,4,4)}}
  for(const n of ch.npcs){const p=conv(n.x,n.y);if(p.x>=0&&p.y>=0&&p.x<w&&p.y<h){c.fillStyle='#6ee7ff';mapDot(c,p.x,p.y,3)}}
 }
 for(const e of enemies)if(e.alive){const p=conv(e.x,e.y);if(p.x>=0&&p.y>=0&&p.x<w&&p.y<h){c.fillStyle=e.mythic?'#d77cff':e.boss?'#ff9d45':'#ff5d62';mapDot(c,p.x,p.y,e.boss?4:2)}}
 c.fillStyle='#fff';mapDot(c,w/2,h/2,4);c.strokeStyle='#2f80ed';c.lineWidth=2;c.stroke();
}
function drawMinimap(){
 mctx.save();
 mctx.clearRect(0,0,mini.width,mini.height);
 mctx.beginPath();mctx.arc(mini.width/2,mini.height/2,mini.width/2-2,0,Math.PI*2);mctx.clip();
 drawMap(mctx,mini.width,mini.height,900);
 mctx.restore();
 mctx.beginPath();mctx.arc(mini.width/2,mini.height/2,mini.width/2-2,0,Math.PI*2);
 mctx.strokeStyle='rgba(255,255,255,.55)';mctx.lineWidth=4;mctx.stroke();
}
function drawWorldMap(){drawMap(wctx,worldMap.width,worldMap.height,2600)}

function drawWeather(){
 if(weather==='rain'){ctx.strokeStyle='rgba(180,220,255,.45)';for(let i=0;i<60;i++){const x=(i*97+performance.now()*.22)%innerWidth,y=(i*53+performance.now()*.45)%innerHeight;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+12);ctx.stroke()}}
 if(weather==='fog'){ctx.fillStyle='rgba(220,230,230,.16)';ctx.fillRect(0,0,innerWidth,innerHeight)}
 const hr=worldTime/60;if(hr<6||hr>19){ctx.fillStyle='rgba(8,16,38,.38)';ctx.fillRect(0,0,innerWidth,innerHeight)}
}
function render(){
 const now=performance.now(),dt=Math.min(.033,(now-last)/1000);last=now;
 update(dt);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
 drawWorld(player.x,player.y);drawFloating(player.x,player.y,dt);drawWeather();drawMinimap();
 hud.innerHTML=`<b>Lv.${state.lv}</b>　💰${state.gold}G<br>❤️ <span class="bar"><span class="fill hp" style="width:${state.hp/state.maxHp*100}%"></span></span> ${Math.ceil(state.hp)}/${state.maxHp}<br>💧 <span class="bar"><span class="fill mp" style="width:${state.mp/state.maxMp*100}%"></span></span> ${Math.ceil(state.mp)}/${state.maxMp}<br>🟢 <span class="bar"><span class="fill st" style="width:${state.st/state.maxSt*100}%"></span></span> ${Math.ceil(state.st)}/${state.maxSt}<br>⭐ <span class="bar"><span class="fill xp" style="width:${state.xp/(state.lv*100)*100}%"></span></span> ${state.xp}/${state.lv*100}<br>⚔️ ${weapons.find(w=>w.id===weapon).name}　ATK ${state.atk}　⚡${Math.floor(state.burst)}%`;
 const q=AI.quests.find(q=>!q.done);
 objective.textContent=STORY.chapter>0?`目的：${storyObjective()}`:(q?`目的：${q.name} ${(q.progress||0)}/${q.goal}`:'目的：自由探索');
 const hr=worldTime/60;
 const weatherText=weather==='rain'?'🌧️ 雨':weather==='fog'?'🌫️ 霧':'🌤️ 晴れ';
 worldChip.textContent=`🤖 ${AI.job} / ${weatherText} ${hr<6||hr>19?'夜':'昼'} / ⚔️ ${factionSummary()} / 👑${SKILL_TREE.authority.length}`;
 const boss=MYTHIC.active?.alive?MYTHIC.active:enemies.find(e=>e.alive&&e.boss&&Math.hypot(player.x-e.x,player.y-e.y)<500);if(boss){bossHUD.style.display='block';bossName.textContent=boss.name;bossFill.style.width=(boss.hp/boss.maxHp*100)+'%'}else bossHUD.style.display='none';
 requestAnimationFrame(render);
}
renderMenu();renderAI();renderTown();renderCraft();renderParty();renderSkillTree();renderDungeon();renderLegendary();renderSins();renderAchievements();renderQuestBranch();render();
})();
</script>
