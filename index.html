<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>勇者の冒険 REAL</title>
<style>
:root{--panel:rgba(10,14,18,.82);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#081018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% -20%,#17344c,#081018 55%)}
#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:5;display:flex;gap:8px;justify-content:space-between}
.card{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 8px 24px #0008}
#stats{min-width:220px;font-size:13px;line-height:1.55}
.bar{width:150px;height:8px;background:#ffffff1a;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.fill{height:100%;border-radius:99px}.hp{background:linear-gradient(90deg,#ff3b4f,#ff7a59)}.mp{background:linear-gradient(90deg,#3f8cff,#61d5ff)}.xp{background:linear-gradient(90deg,#f2c14e,#ffe38a)}
#quest{font-size:12px;max-width:240px}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#log{position:absolute;left:50%;transform:translateX(-50%);bottom:116px;width:min(92vw,660px);z-index:4;background:rgba(8,11,15,.76);border:1px solid var(--line);border-radius:13px;padding:8px 12px;font-size:13px;min-height:40px;text-align:center;backdrop-filter:blur(8px)}
#controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 16px;z-index:6;pointer-events:none}
#stick{width:150px;height:150px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff22;position:relative;pointer-events:auto;box-shadow:inset 0 0 30px #0008}
#knob{position:absolute;width:68px;height:68px;border-radius:50%;left:41px;top:41px;background:linear-gradient(#ffffff36,#ffffff18);border:1px solid #ffffff55;box-shadow:0 5px 15px #0008}
#actions{display:grid;grid-template-columns:repeat(2,70px);gap:10px;pointer-events:auto}
.action{width:70px;height:70px;border-radius:50%;border:1px solid #ffffff44;background:linear-gradient(#263341dd,#121a23ee);color:#fff;font-size:12px;font-weight:700;box-shadow:0 8px 18px #0009}
.action b{display:block;font-size:25px;margin-bottom:2px}.action:active{transform:scale(.95)}
#bossHud{display:none;position:absolute;top:88px;left:50%;transform:translateX(-50%);z-index:5;width:min(86vw,620px);background:#180b0ddd;border:1px solid #ff6b6b55;border-radius:12px;padding:8px 12px;text-align:center}
#bossHud .bar{width:82%;height:10px}
#menu{position:absolute;right:10px;top:88px;z-index:7;display:flex;gap:6px}
.small{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:8px 10px}
@media (max-width:700px){#quest{display:none}#stats{min-width:190px}.bar{width:110px}#stick{width:130px;height:130px}#knob{left:36px;top:36px;width:58px;height:58px}#actions{grid-template-columns:repeat(2,62px)}.action{width:62px;height:62px}}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud">
  <div id="stats" class="card"></div>
  <div id="quest" class="card">📜 任務：王都東の森で魔物を倒し、北東の魔王城を目指せ。</div>
</div>
<div id="bossHud"><div id="bossName"></div><div class="bar"><div id="bossBar" class="fill hp"></div></div></div>
<div id="menu"><button class="small" onclick="saveGame()">💾</button><button class="small" onclick="loadGame()">📂</button></div>
<div id="log">画面左下のスティックで移動。右下で攻撃・スキル・回避・回復。</div>
<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button class="action" id="attackBtn"><b>⚔️</b>攻撃</button>
    <button class="action" id="skillBtn"><b>🔥</b>スキル</button>
    <button class="action" id="dodgeBtn"><b>💨</b>回避</button>
    <button class="action" id="healBtn"><b>✨</b>回復</button>
  </div>
</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
function resize(){canvas.width=innerWidth*DPR;canvas.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const WORLD={w:4200,h:2800};
const player={x:700,y:1450,r:18,hp:120,maxHp:120,mp:45,maxMp:45,lv:1,xp:0,gold:120,speed:175,atk:23};
let cam={x:0,y:0},joy={x:0,y:0},last=performance.now(),attackCD=0,skillCD=0,dodgeUntil=0,hitFlash=0;
let bossDefeated=false,hiddenDefeated=false,questKills=0;
const logEl=document.getElementById('log'),bossHud=document.getElementById('bossHud'),bossName=document.getElementById('bossName'),bossBar=document.getElementById('bossBar');
const towns=[{x:650,y:1450,name:'王都アルカディア',icon:'🏰'},{x:1700,y:700,name:'港町ルミナ',icon:'⚓'},{x:3000,y:2050,name:'雪原の砦',icon:'🏯'}];
const dungeons=[{x:2150,y:1500,name:'古代遺跡',icon:'🗿'},{x:3500,y:520,name:'魔王城',icon:'🏰'},{x:3850,y:2450,name:'禁足地',icon:'🌑'}];
const lakes=[{x:1200,y:2100,rx:380,ry:220},{x:2550,y:900,rx:430,ry:230}];
const forests=[{x:1050,y:900,r:520},{x:2050,y:1950,r:460},{x:3150,y:1350,r:520}];
const enemies=[];
function makeEnemy(type,x,y,boss=false,hidden=false){
 const map={slime:{name:'スライム',emoji:'🟢',hp:55,atk:8,speed:70,r:17,xp:18,gold:12},wolf:{name:'ダークウルフ',emoji:'🐺',hp:85,atk:12,speed:105,r:19,xp:28,gold:18},orc:{name:'オーク',emoji:'👹',hp:130,atk:17,speed:65,r:23,xp:42,gold:30},boss:{name:'魔王ガルド',emoji:'👿',hp:900,atk:28,speed:80,r:34,xp:300,gold:700},hidden:{name:'深淵王アビス',emoji:'🐉',hp:1600,atk:38,speed:92,r:42,xp:600,gold:1500}};
 const b=map[type]; return {type,...b,x,y,maxHp:b.hp,boss,hidden,alive:true,nextAtk:0};
}
for(let i=0;i<26;i++){let f=forests[i%forests.length],a=Math.random()*Math.PI*2,r=Math.random()*f.r;let type=i%5===0?'orc':i%2?'wolf':'slime';enemies.push(makeEnemy(type,f.x+Math.cos(a)*r,f.y+Math.sin(a)*r));}
enemies.push(makeEnemy('boss',3500,520,true,false));enemies.push(makeEnemy('hidden',3850,2450,true,true));
function terrainAt(x,y){for(const l of lakes){if(((x-l.x)/l.rx)**2+((y-l.y)/l.ry)**2<1)return 'water'}for(const f of forests){if(Math.hypot(x-f.x,y-f.y)<f.r)return 'forest'}return y<450?'snow':y>2250?'desert':'grass'}
function blocked(x,y){if(x<40||y<40||x>WORLD.w-40||y>WORLD.h-40)return true;return terrainAt(x,y)==='water'}
function msg(t){logEl.textContent=t}
function updateHUD(){const hp=Math.max(0,player.hp/player.maxHp*100),mp=player.mp/player.maxMp*100,xp=(player.xp%(player.lv*100))/(player.lv*100)*100;document.getElementById('stats').innerHTML=`Lv.${player.lv}　💰${player.gold}G<br>❤️ <span class="bar"><span class="fill hp" style="display:block;width:${hp}%"></span></span> ${Math.ceil(player.hp)}/${player.maxHp}<br>💧 <span class="bar"><span class="fill mp" style="display:block;width:${mp}%"></span></span> ${Math.ceil(player.mp)}/${player.maxMp}<br>⭐ <span class="bar"><span class="fill xp" style="display:block;width:${xp}%"></span></span>`}
function drawWorld(){const w=innerWidth,h=innerHeight;cam.x=player.x-w/2;cam.y=player.y-h/2;cam.x=Math.max(0,Math.min(WORLD.w-w,cam.x));cam.y=Math.max(0,Math.min(WORLD.h-h,cam.y));ctx.fillStyle='#294f32';ctx.fillRect(0,0,w,h);const grid=80;for(let gx=Math.floor(cam.x/grid)*grid;gx<cam.x+w+grid;gx+=grid){for(let gy=Math.floor(cam.y/grid)*grid;gy<cam.y+h+grid;gy+=grid){const t=terrainAt(gx,gy);let col=t==='forest'?'#23472a':t==='water'?'#235777':t==='snow'?'#c7d5d9':t==='desert'?'#8a7242':'#315d39';ctx.fillStyle=col;ctx.fillRect(gx-cam.x,gy-cam.y,grid+1,grid+1);if(t==='forest'&&(gx+gy)%160===0){ctx.font='24px serif';ctx.fillText('🌲',gx-cam.x+20,gy-cam.y+35)}if(t==='snow'&&(gx+gy)%240===0){ctx.font='20px serif';ctx.fillText('❄️',gx-cam.x+25,gy-cam.y+35)}}}for(const l of lakes){ctx.save();ctx.translate(l.x-cam.x,l.y-cam.y);ctx.scale(l.rx,l.ry);ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.fillStyle='#1f668b';ctx.fill();ctx.restore()}ctx.strokeStyle='#a58b5b';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(650-cam.x,1450-cam.y);ctx.lineTo(1700-cam.x,700-cam.y);ctx.lineTo(2150-cam.x,1500-cam.y);ctx.lineTo(3500-cam.x,520-cam.y);ctx.stroke();ctx.strokeStyle='#d0b77f';ctx.lineWidth=7;ctx.stroke();for(const t of towns)drawPOI(t.x,t.y,t.icon,t.name);for(const d of dungeons)drawPOI(d.x,d.y,d.icon,d.name)}
function drawPOI(x,y,icon,name){const sx=x-cam.x,sy=y-cam.y;if(sx<-100||sy<-100||sx>innerWidth+100||sy>innerHeight+100)return;ctx.font='42px serif';ctx.fillText(icon,sx-21,sy+14);ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(name,sx,sy+38);ctx.textAlign='left'}
function drawEnemy(e){if(!e.alive)return;const sx=e.x-cam.x,sy=e.y-cam.y;if(sx<-80||sy<-80||sx>innerWidth+80||sy>innerHeight+80)return;ctx.save();ctx.translate(sx,sy);if(e.boss){ctx.shadowColor=e.hidden?'#7c3cff':'#ff3b55';ctx.shadowBlur=25}ctx.font=`${e.r*2}px serif`;ctx.textAlign='center';ctx.fillText(e.emoji,0,e.r*.7);ctx.shadowBlur=0;ctx.fillStyle='#0009';ctx.fillRect(-32,e.r+7,64,6);ctx.fillStyle=e.boss?'#ff4d5d':'#79e36d';ctx.fillRect(-32,e.r+7,64*(e.hp/e.maxHp),6);ctx.restore();ctx.textAlign='left'}
function drawPlayer(){const sx=player.x-cam.x,sy=player.y-cam.y;ctx.save();ctx.translate(sx,sy);if(Date.now()<dodgeUntil)ctx.globalAlpha=.5;ctx.shadowColor='#4aa3ff';ctx.shadowBlur=18;ctx.fillStyle='#4aa3ff';ctx.beginPath();ctx.arc(0,0,21,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🧑‍⚔️',0,10);if(hitFlash>0){ctx.fillStyle='#ff3b3b88';ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.textAlign='left'}
function nearestEnemy(range=150){let best=null,bd=Infinity;for(const e of enemies){if(!e.alive)continue;let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<range&&d<bd){best=e;bd=d}}return best}
function playerAttack(){if(attackCD>0)return;attackCD=.35;const e=nearestEnemy(105);if(!e){msg('⚔️ 攻撃したが、敵に届かなかった。');return}const dmg=Math.floor(player.atk+player.lv*3+Math.random()*10);e.hp-=dmg;msg(`⚔️ ${e.name}に ${dmg} ダメージ！`);if(e.hp<=0)killEnemy(e)}
function playerSkill(){if(skillCD>0||player.mp<10)return;skillCD=1.8;player.mp-=10;let hit=0;for(const e of enemies){if(e.alive&&Math.hypot(e.x-player.x,e.y-player.y)<170){let d=45+player.lv*7;e.hp-=d;hit++;if(e.hp<=0)killEnemy(e)}}msg(hit?`🔥 範囲スキル！ ${hit}体に命中！`:'🔥 スキル発動！ しかし敵はいない。')}
function dodge(){dodgeUntil=Date.now()+650;msg('💨 回避！ 0.65秒間無敵')}
function heal(){if(player.mp<8||player.hp>=player.maxHp)return;player.mp-=8;let h=35+player.lv*5;player.hp=Math.min(player.maxHp,player.hp+h);msg(`✨ HPを ${h} 回復した`)}
function killEnemy(e){e.alive=false;player.gold+=e.gold;player.xp+=e.xp;if(!e.boss)questKills++;if(e.hidden){hiddenDefeated=true;msg('🏆 隠しボス「深淵王アビス」を撃破！')}else if(e.boss){bossDefeated=true;msg('🏆 魔王ガルド撃破！ 世界に平和が戻った！')}else msg(`🎉 ${e.name}撃破！ EXP+${e.xp} / ${e.gold}G`);const need=player.lv*100;if(player.xp>=need){player.xp-=need;player.lv++;player.maxHp+=22;player.hp=player.maxHp;player.maxMp+=6;player.mp=player.maxMp;player.atk+=5;msg(`⬆️ レベルアップ！ Lv.${player.lv}`)}}
function updateEnemies(dt){let shownBoss=null;for(const e of enemies){if(!e.alive)continue;const d=Math.hypot(e.x-player.x,e.y-player.y);if(e.boss&&d<500)shownBoss=e;if(d<330){let dx=(player.x-e.x)/d,dy=(player.y-e.y)/d;const mult=e.boss&&e.hp<e.maxHp*.5?1.35:1;e.x+=dx*e.speed*mult*dt;e.y+=dy*e.speed*mult*dt}e.nextAtk-=dt;if(d<e.r+player.r+12&&e.nextAtk<=0){e.nextAtk=e.boss?1.05:1.45;if(Date.now()<dodgeUntil){msg('✨ 回避成功！');continue}let dmg=e.atk+Math.floor(Math.random()*7);if(e.boss&&Math.random()<.3){dmg+=18;msg(`🔥 ${e.name}の特殊攻撃！`)}player.hp-=dmg;hitFlash=.18;if(player.hp<=0){player.hp=player.maxHp;player.mp=player.maxMp;player.x=650;player.y=1450;msg('💫 力尽きた。王都へ戻された。')}}}if(shownBoss){bossHud.style.display='block';bossName.textContent=shownBoss.name;bossBar.style.width=(shownBoss.hp/shownBoss.maxHp*100)+'%'}else bossHud.style.display='none'}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;attackCD=Math.max(0,attackCD-dt);skillCD=Math.max(0,skillCD-dt);hitFlash=Math.max(0,hitFlash-dt);let len=Math.hypot(joy.x,joy.y);if(len>.05){let nx=joy.x/Math.max(1,len),ny=joy.y/Math.max(1,len),spd=player.speed*(Date.now()<dodgeUntil?1.8:1);let tx=player.x+nx*spd*dt,ty=player.y+ny*spd*dt;if(!blocked(tx,player.y))player.x=tx;if(!blocked(player.x,ty))player.y=ty}player.mp=Math.min(player.maxMp,player.mp+2.1*dt);updateEnemies(dt);drawWorld();for(const e of enemies)drawEnemy(e);drawPlayer();updateHUD();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let active=false;
function joySet(clientX,clientY){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=r.width*.32,len=Math.hypot(dx,dy)||1,cl=Math.min(max,len);joy.x=dx/len*(cl/max);joy.y=dy/len*(cl/max);knob.style.transform=`translate(${joy.x*max}px,${joy.y*max}px)`}
stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);joySet(e.clientX,e.clientY)});stick.addEventListener('pointermove',e=>{if(active)joySet(e.clientX,e.clientY)});function joyEnd(){active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
document.getElementById('attackBtn').onpointerdown=playerAttack;document.getElementById('skillBtn').onpointerdown=playerSkill;document.getElementById('dodgeBtn').onpointerdown=dodge;document.getElementById('healBtn').onpointerdown=heal;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')playerAttack();if(e.key.toLowerCase()==='q')playerSkill();if(e.key==='Shift')dodge();if(e.key.toLowerCase()==='e')heal()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);setInterval(()=>{joy.x=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);joy.y=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)},16);
function saveGame(){localStorage.setItem('yuusha_real_v2',JSON.stringify({player,bossDefeated,hiddenDefeated,questKills,enemies:enemies.map(e=>({alive:e.alive,hp:e.hp}))}));msg('💾 セーブしました')}
function loadGame(){const s=localStorage.getItem('yuusha_real_v2');if(!s){msg('📂 セーブデータがありません');return}const d=JSON.parse(s);Object.assign(player,d.player);bossDefeated=d.bossDefeated;hiddenDefeated=d.hiddenDefeated;questKills=d.questKills||0;if(d.enemies)d.enemies.forEach((v,i)=>{if(enemies[i]){enemies[i].alive=v.alive;enemies[i].hp=v.hp}});msg('📂 ロードしました')}
</script>
</body></html>
